{
  group:"Integrate",
  title:"Webhooks & service hooks",
  tag:"GitHub webhooks · signatures · service hooks",
  intro:`Webhooks push events to other systems the moment something happens, so nobody has to poll. GitHub calls them <b>webhooks</b>. Azure DevOps calls them <b>service hooks</b>. Both send an HTTP POST with a JSON payload, and the receiver is responsible for checking that the request is genuine.`,
  sections:[
    {h:"GitHub webhooks", p:`You can create a webhook on a <b>repository</b>, an <b>organization</b> or a <b>GitHub App</b>. You configure: <b>Payload URL</b>, <b>Content type</b> (<code>application/json</code> or <code>application/x-www-form-urlencoded</code>), a <b>Secret</b>, SSL verification, and which <b>events</b> to send (just <code>push</code>, everything, or a selection such as <code>pull_request</code>, <code>issues</code>, <code>release</code>, <code>workflow_run</code>). GitHub sends a <code>ping</code> event when the webhook is created.`,
     after:`<table class="ref">
      <tr><th>Delivery header</th><th>Meaning</th></tr>
      <tr><td><code>X-GitHub-Event</code></td><td>Event name, such as <code>push</code> or <code>pull_request</code>. The payload's <code>action</code> field says what happened (opened, closed…).</td></tr>
      <tr><td><code>X-GitHub-Delivery</code></td><td>A GUID that identifies this delivery</td></tr>
      <tr><td><code>X-Hub-Signature-256</code></td><td><code>sha256=</code> + the HMAC-SHA256 hex digest of the raw body, keyed with your secret. Sent only when a secret is set.</td></tr>
      <tr><td><code>X-Hub-Signature</code></td><td>Legacy HMAC-SHA1 version. Use the SHA-256 header.</td></tr>
      <tr><td><code>X-GitHub-Hook-ID</code></td><td>ID of the webhook configuration</td></tr>
     </table>
     <p>Respond with a <b>2XX within 10 seconds</b>: queue the work and process it asynchronously. GitHub <b>doesn't automatically redeliver</b> failed deliveries. You redeliver them from <b>Recent Deliveries</b> or through the REST API.</p>`},
    {h:"Validating the signature", file:"verify.py", lang:"text", code:`import hmac, hashlib

def is_valid(secret: str, raw_body: bytes, header: str) -> bool:
    expected = "sha256=" + hmac.new(secret.encode(), raw_body, hashlib.sha256).hexdigest()
    return hmac.compare_digest(expected, header or "")`,
     p:`Use the <b>raw body bytes</b>, not JSON you parsed and re-serialised, because any change breaks the HMAC. Compare in <b>constant time</b> (<code>compare_digest</code>, <code>timingSafeEqual</code>), never with <code>==</code>. The secret is never sent over the wire, only the signature.`},
    {h:"Azure DevOps service hooks", p:`<b>Project settings → Service hooks → Create subscription</b>: pick a <b>service</b> (the consumer), a <b>trigger</b> event with filters, then the action settings. Events include <i>Build completed</i>, <i>Code pushed</i>, <i>Pull request created / updated / merge attempted</i>, <i>Work item created / updated / commented on</i>, <i>Release deployment completed</i>, and <i>Run state changed</i> / <i>Run stage state changed</i> for YAML pipelines. Consumers include <b>Web Hooks</b> (HTTP POST; optional basic authentication and custom HTTP headers; choose how much resource detail and how many messages to send: All, Minimal or None), <b>Azure Service Bus</b>, <b>Azure Storage Queue</b>, Jenkins and several third-party services. By default, Project Administrators manage subscriptions. Each subscription's <b>History</b> shows its deliveries. You can also script subscriptions with the REST API (<code>_apis/hooks/subscriptions</code>). The old Microsoft Teams service-hook integration, which was based on Office 365 connectors, is retired. Use the Teams apps (module 9) instead.`},
    {h:"Webhooks into pipelines", p:`Going the other way, an external system can <b>trigger</b> a pipeline. In Azure Pipelines, create an <b>Incoming WebHook</b> service connection (webhook name, plus an optional secret so payloads are checksum-validated). Declare it as a resource, then POST to <code>https://dev.azure.com/&lt;org&gt;/_apis/public/distributedtask/webhooks/&lt;webhook name&gt;?api-version=6.0-preview</code>. In GitHub Actions, the equivalent is <code>repository_dispatch</code> (<code>POST /repos/{owner}/{repo}/dispatches</code> with an <code>event_type</code>).`,
     lang:"yaml", code:`trigger: none
resources:
  webhooks:
    - webhook: ArtifactPublished        # alias, also the name used in the URL
      connection: artifact-hook-conn     # the Incoming WebHook service connection
      filters:
        - path: repositoryName           # JSON path in the payload
          value: maven-releases          # only run when it has this value
steps:
  - script: echo "Version \${{ parameters.ArtifactPublished.version }}"`}
  ],
  tip:`Know the GitHub header names (<code>X-GitHub-Event</code>, <code>X-Hub-Signature-256</code>), that the secret produces an HMAC-SHA256 of the body, and the 10-second response window. For Azure DevOps, the pattern is publisher → event + filters → consumer. If the receiver can be offline, use a queue consumer (Service Bus / Storage Queue).`,
  exercises:[
    {id:"hook-verify", kind:"code", lang:"js", title:"Verify a GitHub webhook signature",
     task:`Complete <code>isFromGitHub(req)</code> in Node.js. <code>req.rawBody</code> is a Buffer with the exact bytes GitHub sent, and the secret is in <code>process.env.WEBHOOK_SECRET</code>. Read the SHA-256 signature header, compute the expected value, and compare the two in constant time. Return <code>false</code> when the lengths differ, because <code>timingSafeEqual</code> throws on different lengths.`,
     starter:`const crypto = require("node:crypto");

function isFromGitHub(req) {
  const received = req.headers[/* which header? (Node lowercases names) */];
  // compute the expected signature and compare safely
}
`,
     checks:[
       {l:"Reads the x-hub-signature-256 header", t:x => /["'`]x-hub-signature-256["'`]/i.test(x.src)},
       {l:"HMAC with sha256 keyed by the secret", t:x => /createHmac\(\s*["'`]sha256["'`]\s*,\s*[^)]*(secret|SECRET)/.test(x.src)},
       {l:"Hashes the raw body", t:x => /\.update\(\s*[\w.]*raw\w*\s*\)/i.test(x.src)},
       {l:"Hex digest with the sha256= prefix", t:x => /digest\(\s*["'`]hex["'`]\s*\)/.test(x.src) && /["'`]sha256=/.test(x.src)},
       {l:"Constant-time compare with timingSafeEqual", t:x => /timingSafeEqual\(/.test(x.src)},
       {l:"Guards against different lengths", t:x => /\.length\s*(!==|===|!=|==)/.test(x.src)}
     ],
     hint:`<code>"sha256=" + crypto.createHmac("sha256", secret).update(req.rawBody).digest("hex")</code>. Turn both strings into Buffers before <code>crypto.timingSafeEqual(a, b)</code>.`,
     solution:`const crypto = require("node:crypto");

function isFromGitHub(req) {
  const received = req.headers["x-hub-signature-256"] || "";
  const expected = "sha256=" + crypto
    .createHmac("sha256", process.env.WEBHOOK_SECRET)
    .update(req.rawBody)
    .digest("hex");
  const a = Buffer.from(expected);
  const b = Buffer.from(received);
  return a.length === b.length && crypto.timingSafeEqual(a, b);
}`,
     explain:`Only someone who knows the secret can produce a matching HMAC over these exact bytes, so a match proves the request came from GitHub and wasn't modified. Hash the raw body: parsing and re-serialising JSON changes whitespace and key order. A constant-time compare avoids leaking, through response timing, how many leading characters matched.`},
    {id:"hook-sig", kind:"mcq", title:"Which signature is valid?",
     task:`The webhook secret is <code>s3cr3t</code> and the raw body is exactly <code>{"action":"opened"}</code>. HMAC-SHA256 of that body with that key is <code>893b8b176c39b217756497563a1b9ba1507d371642b1edf4ee9f876b8fd74ecc</code>. Which header would a correct receiver accept?`,
     options:[
       `<code>X-Hub-Signature-256: 893b8b176c39b217756497563a1b9ba1507d371642b1edf4ee9f876b8fd74ecc</code>`,
       `<code>X-Hub-Signature: sha256=893b8b176c39b217756497563a1b9ba1507d371642b1edf4ee9f876b8fd74ecc</code>`,
       `<code>X-Hub-Signature-256: sha256=893b8b176c39b217756497563a1b9ba1507d371642b1edf4ee9f876b8fd74ecc</code>`,
       `<code>X-Hub-Signature-256: sha256=s3cr3t</code>`],
     answer:2,
     hint:`Right header name, right prefix, and the secret itself never travels.`,
     explain:`GitHub sends <code>X-Hub-Signature-256: sha256=&lt;hex digest&gt;</code>. Without the <code>sha256=</code> prefix, a correct string comparison fails. <code>X-Hub-Signature</code> is the legacy header and carries a <code>sha1=</code> value. The secret itself never appears in a request.`},
    {id:"hook-event", kind:"text", title:"Which event is this?",
     task:`A single endpoint receives several GitHub event types. Which request header tells it the event type (for example <code>pull_request</code>)?`,
     placeholder:"X-...",
     accept:[/^X-GitHub-Event:?$/i],
     solution:`X-GitHub-Event`,
     bad:[`X-GitHub-Delivery`, `X-Hub-Signature-256`],
     hint:`It's in the <code>X-GitHub-*</code> family.`,
     explain:`Switch on <code>X-GitHub-Event</code> (for example <code>push</code>, <code>pull_request</code>, <code>ping</code>), then on the payload's <code>action</code> field. <code>X-GitHub-Delivery</code> is the unique GUID of the delivery. It's handy for de-duplicating and for finding the delivery in Recent Deliveries.`},
    {id:"hook-trigger", kind:"code", lang:"yaml", title:"Trigger a pipeline from an external webhook",
     task:`Write an Azure Pipelines YAML file that:
       <ul class="tips"><li>has <b>no</b> CI trigger</li>
       <li>is triggered by a webhook resource with alias <code>OrderEvents</code> through the Incoming WebHook service connection <code>orders-hook</code></li>
       <li>only runs when the payload's <code>eventType</code> equals <code>order.created</code></li>
       <li>has a script step that echoes the payload's <code>orderId</code></li></ul>`,
     starter:``,
     checks:[
       {l:"trigger: none", t:x => x.y.h("trigger","none")},
       {l:"resources.webhooks item: webhook OrderEvents, connection orders-hook", t:x => x.y.item("resources.webhooks",{webhook:"OrderEvents", connection:"orders-hook"})},
       {l:"Filter: path eventType, value order.created", t:x => x.y.item("resources.webhooks[].filters",{path:"eventType", value:"order.created"})},
       {l:"A step uses \${{ parameters.OrderEvents.orderId }}", t:x => x.y.h(/^steps\[\]\.(script|bash|pwsh|powershell|inputs\.script)$/i, /\$\{\{\s*parameters\.OrderEvents\.orderId\s*\}\}/)}
     ],
     hint:`<code>resources: webhooks: - webhook: … connection: … filters: - path: … value: …</code>. Payload fields are available as <code>\${{ parameters.&lt;alias&gt;.&lt;field&gt; }}</code>.`,
     solution:`trigger: none

resources:
  webhooks:
    - webhook: OrderEvents
      connection: orders-hook
      filters:
        - path: eventType
          value: order.created

steps:
  - script: echo "New order \${{ parameters.OrderEvents.orderId }}"`,
     explain:`The external system POSTs JSON to <code>…/_apis/public/distributedtask/webhooks/OrderEvents?api-version=6.0-preview</code>. Filters stop the run unless the JSON path has the given value. If you set a secret on the service connection, Azure DevOps validates the payload checksum before it starts a run.`},
    {id:"hook-facts", kind:"multi", title:"GitHub webhook behaviour",
     task:`Which statements about GitHub webhooks are true? Select all that apply.`,
     options:[
       `Your endpoint should return a 2XX response within 10 seconds`,
       `GitHub automatically retries failed deliveries every few minutes for a day`,
       `A <code>ping</code> event is sent when you create a webhook`,
       `The secret is sent in the <code>X-Hub-Secret</code> header so you can compare it`,
       `You can redeliver a past delivery from the webhook's Recent Deliveries page`],
     answer:[0,2,4],
     hint:`Two of the options are invented. The secret never leaves GitHub.`,
     explain:`GitHub expects a quick 2XX (within 10 seconds), so do the heavy work asynchronously. A <code>ping</code> event confirms the configuration. Failed deliveries are <b>not</b> retried automatically: you redeliver them manually or through the REST API. There's no <code>X-Hub-Secret</code> header. The secret only keys the HMAC in <code>X-Hub-Signature-256</code>.`},
    {id:"hook-queue", kind:"mcq", title:"Don't lose events",
     task:`Every work item update in Azure Boards must be processed by an internal billing service. The service is taken offline for maintenance every week, and it must not miss any events. What do you configure?`,
     options:[
       `A service hook with the <b>Web Hooks</b> consumer posting straight to the billing service`,
       `A service hook with the <b>Azure Service Bus</b> consumer. The billing service reads from the queue.`,
       `An email notification subscription for the billing team`,
       `The Azure Boards app for Microsoft Teams in the billing channel`],
     answer:1,
     hint:`Something has to hold the events while the receiver is down.`,
     explain:`A queue such as Azure Service Bus (or Azure Storage Queue) separates the sender from the receiver. Azure DevOps delivers to the queue, and the billing service drains it when it comes back, so no events are lost. A direct web hook fails while the endpoint is down. Email and Teams are for people, not systems.`}
  ]
},

{
  group:"Integrate",
  title:"Azure Boards + GitHub",
  tag:"Azure Boards app · AB# · state transitions",
  intro:`Many teams keep code on GitHub and plan their work in Azure Boards. The <b>Azure Boards app</b> connects the two, so commits, pull requests, branches and issues link to work items and can move them through their workflow.`,
  sections:[
    {h:"Connecting", p:`<b>From GitHub</b>: install the <b>Azure Boards</b> app from the GitHub Marketplace, choose all repositories or selected ones, then pick the Azure DevOps organization and project. <b>From Azure DevOps</b>: <b>Project settings → Boards → GitHub connections → Connect your GitHub account</b> (a personal access token is also supported), then select the repos. Azure DevOps Services works with GitHub.com and GitHub Enterprise Server. Azure DevOps Server works with GitHub Enterprise Server only. Microsoft recommends connecting a repo to projects in <b>a single</b> Azure DevOps organization, because connecting it to several can cause unexpected <code>AB#</code> linking.`},
    {h:"Linking with AB#", p:`Write <code>AB#{ID}</code> in a <b>commit message</b>, a <b>pull request description</b> or an <b>issue description</b>. The link appears in the work item's <b>Development</b> section, and links from a PR description also appear in the PR's Development area on GitHub. <code>AB#</code> in a <b>PR title</b> or a <b>comment</b> doesn't create a link. From the work item you can also <b>Add link</b> to a GitHub commit, PR or branch, use <b>Work item actions → New GitHub branch</b>, and mention GitHub PRs in discussions with <code>!</code>. The resulting links update automatically: a PR created from a linked branch is linked, its merge commit is linked, and deleting the branch removes its link.`},
    {h:"State transitions", after:`<table class="ref">
      <tr><th>Text in the commit or PR</th><th>Result</th></tr>
      <tr><td><code>AB#123</code> · <code>Adds a feature, AB#123.</code></td><td>Links 123, no state change</td></tr>
      <tr><td><code>Fixed AB#123</code> (also <code>fix</code> / <code>fixes</code>)</td><td>Links 123 and moves it to the first state in the <b>Resolved</b> category. If the process has none, the first state in the <b>Completed</b> category.</td></tr>
      <tr><td><code>Closed AB#123</code></td><td>Moves it to the <i>Closed</i> state, if that state exists</td></tr>
      <tr><td><code>Fixes AB#123, AB#124, and AB#126</code></td><td>Links all three, but <b>only 123</b> transitions</td></tr>
      <tr><td><code>Fixes AB#123, Fixes AB#124, Fixes AB#125</code></td><td>Links and transitions all three</td></tr>
     </table>
     <p>Transitions only happen when the pull request is <b>merged into the default branch</b>. Links are created whatever the target branch.</p>`},
    {h:"Extras", p:`Turn on GitHub annotations on board cards to open linked commits and PRs from the board. Add an Azure Boards <b>status badge</b> to a GitHub README. For a YAML pipeline that builds the GitHub repo, enable <b>Automatically link new work items in this build</b> to get <i>Integrated in build</i> links.`}
  ],
  tip:`Exam favourites: <code>AB#</code> syntax, which keyword transitions which work item, the "only on merge into the default branch" rule, and that the integration is set up by installing the <b>Azure Boards app</b> in GitHub (or adding a GitHub connection in project settings).`,
  exercises:[
    {id:"ab-commit", kind:"code", lang:"text", title:"Link and resolve two work items",
     task:`Write a pull request description for a GitHub repo connected to Azure Boards. Merging it should <b>link</b> work items <b>101</b> and <b>102</b> and <b>transition both</b> to their resolved state. Use the <code>fix</code> family of keywords.`,
     starter:``,
     checks:[
       {l:"Work item 101 with a fix keyword right before it", t:x => /\bfix(e[sd])?\s+AB#101\b/i.test(x.src)},
       {l:"Work item 102 with its own fix keyword", t:x => /\bfix(e[sd])?\s+AB#102\b/i.test(x.src)}
     ],
     hint:`One keyword only transitions the first <code>AB#</code> after it.`,
     solution:`Correct rounding in the cart total. Fixes AB#101, Fixes AB#102`,
     alts:[`Fixed AB#101\nfixes AB#102`],
     bad:[`Fixes AB#101, AB#102`],
     explain:`With <code>Fixes AB#101, AB#102</code> only 101 would move. Each work item needs its own keyword. The move happens when the PR is merged into the default branch. The work item goes to the first <i>Resolved</i>-category state, or the first <i>Completed</i>-category state if the process has no Resolved category.`},
    {id:"ab-multi", kind:"mcq", title:"One keyword, several IDs",
     task:`A pull request with the description <code>Fixes AB#123, AB#124, and AB#126</code> is merged into <code>main</code> (the default branch). What happens?`,
     options:[
       `All three work items are linked and transitioned`,
       `All three are linked; only 123 is transitioned`,
       `Only 123 is linked and transitioned`,
       `Nothing, because a comma-separated list isn't supported`],
     answer:1,
     hint:`Links and transitions follow different rules.`,
     explain:`Every <code>AB#</code> mention creates a link. A transition keyword applies only to the <code>AB#</code> reference that directly follows it. Write <code>Fixes AB#123, Fixes AB#124, Fixes AB#126</code> to move all three.`},
    {id:"ab-title", kind:"mcq", title:"Where does AB# work?",
     task:`A developer opens a GitHub pull request titled <code>AB#55 Add login page</code> with an empty description. Someone later comments <code>also AB#56</code>. Both work items are in the connected Azure Boards project. Which work items get a link to the PR?`,
     options:[`55 only`, `56 only`, `Both 55 and 56`, `Neither`],
     answer:3,
     hint:`Check which text fields of a PR the integration reads.`,
     explain:`The integration reads <code>AB#</code> in commit messages, PR descriptions and issue descriptions. Mentions in a PR <b>title</b> or a <b>comment</b> don't create links. Putting <code>AB#55 AB#56</code> in the description fixes it. Commits pushed with <code>AB#</code> in their messages would also link.`},
    {id:"ab-branch", kind:"mcq", title:"Merged, but nothing moved",
     task:`A pull request with <code>Fixes AB#77</code> in its description was merged into <code>release/2.0</code>. The repo's default branch is <code>main</code>. What happens to work item 77?`,
     options:[
       `It's linked and moved to its resolved state`,
       `It's linked, but its state doesn't change`,
       `It isn't linked, because only the default branch is scanned`,
       `It's moved to Closed`],
     answer:1,
     hint:`The rule for state transitions is stricter than the rule for links.`,
     explain:`Links are created whatever the target branch. State transitions only apply when the PR is merged into the <b>default branch</b>. The work item will transition once the change reaches <code>main</code> through a PR with the keyword.`},
    {id:"ab-scrum", kind:"mcq", title:"Which state?",
     task:`The project uses the <b>Scrum</b> process. A Product Backlog Item (states New, Approved, Committed, Done) is referenced as <code>Fixes AB#9</code> in a PR that's merged into the default branch. Which state does PBI 9 end up in?`,
     options:[`Committed`, `Resolved`, `Done`, `It stays where it was`],
     answer:2,
     hint:`Fix keywords look for a Resolved-category state first, then fall back.`,
     explain:`<code>fix</code>/<code>fixes</code>/<code>fixed</code> target the first state in the <b>Resolved</b> category. Scrum PBIs don't have one, so the work item goes to the first <b>Completed</b>-category state: <b>Done</b>. In the Agile process, a User Story would go to <i>Resolved</i> instead.`}
  ]
},

{
  group:"Integrate",
  title:"Microsoft Teams",
  tag:"Boards · Pipelines · Repos · GitHub apps",
  intro:`Teams apps bring DevOps events into the channel where the team already talks. Each app links a channel to a project or repo, uses <b>subscriptions</b> to decide what gets posted, and adds actions such as creating work items or approving deployments.`,
  sections:[
    {h:"Which app does what", after:`<table class="ref">
      <tr><th>App</th><th>Use it for</th><th>Good to know</th></tr>
      <tr><td><b>Azure Boards</b></td><td>Work item notifications (filters: area path, work item type, tags), create work items from a message, search and share work items, URL previews</td><td>One Azure Boards project per channel. Use <code>unlink</code> before linking another.</td></tr>
      <tr><td><b>Azure Pipelines</b></td><td>Notifications for builds, releases, YAML stages and pending approvals. <b>Approve or reject deployments from the channel.</b></td><td>Subscribe to a single pipeline or to all pipelines in a project</td></tr>
      <tr><td><b>Azure Repos</b></td><td>Code pushed / checked in, PR created / updated, compose extension, PR URL previews</td><td>Git and TFVC repos in Azure Repos. GitHub repos aren't supported. <code>subscribe</code> creates a default <i>Pull request created</i> subscription.</td></tr>
      <tr><td><b>GitHub</b></td><td>Issues, PRs, commits, comments, deployments, releases (on by default). Optional: reviews, workflows, branches, discussions, label filters.</td><td>In late 2026 the legacy app was replaced by a single <b>GitHub</b> app that combines notifications and Copilot. The subscribe commands are unchanged.</td></tr>
      <tr><td><b>Azure DevOps</b> (tab)</td><td>Pin a dashboard or a Kanban board as a channel tab</td><td></td></tr>
     </table>`},
    {h:"Commands", lang:"text", code:`# Azure Boards

@azure boards link https://dev.azure.com/contoso/Fabrikam

/* ===================================================================
   MINI YAML PARSER (same one the Azure Pipelines lab uses)
   Turns YAML into a flat list of { path, value } entries and reports
   common mistakes: tabs, misaligned siblings, children under a scalar.
   =================================================================== */
const toStr = t => t.reduce((s, x) => x[0] === "[" ? s + x : (s ? s + "." + x : x), "");

function cleanVal(v){
  v = (v || "").trim();
  if (v[0] === "'"){ const m = v.match(/^'((?:[^']|'')*)'/); if (m) return m[1].replace(/''/g, "'"); }
  if (v[0] === '"'){ const m = v.match(/^"((?:[^"\\]|\\.)*)"/); if (m) return m[1]; }
  const ci = v.search(/(^|\s)#/);
  return (ci >= 0 ? v.slice(0, ci) : v).trim();
}

function splitFlow(inner){
  const out = []; let cur = "", depth = 0, q = null;
  for (const ch of inner){
    if (q){ cur += ch; if (ch === q) q = null; continue; }
    if (ch === "'" || ch === '"'){ q = ch; cur += ch; continue; }
    if ("[{(".includes(ch)) depth++;
    if ("]})".includes(ch)) depth--;
    if (ch === "," && depth === 0){ out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  if (cur.trim()) out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}

function parseYaml(text){
  const lines = text.replace(/\r/g, "").split("\n");
  const entries = [], errors = [];
  const root = {col:-1, gt:[], it:[], kids:null};
  const stack = [root], counters = new Map();
  const top = () => stack[stack.length - 1];
  const add = (gt, it, value, line, block) =>
    entries.push({gt, it, gen:toStr(gt), idx:toStr(it), value, line, block:!!block});
  let flagged = -1;
  const sibling = (parent, col, ln, kind) => {
    if (parent.kind && parent.kind !== kind && flagged !== ln){
      flagged = ln;
      errors.push(`Line ${ln}: this ${kind === "list" ? "list item" : "key"} sits at the same level as ${kind === "list" ? "keys" : "\"- \" list items"} under the same parent. A block is either a list or a set of keys, not both. Check the indentation.`);
    }
    parent.kind = parent.kind || kind;
    if (parent.kids === null) parent.kids = col;
    else if (parent.kids !== col && flagged !== ln)
      errors.push(`Line ${ln}: indented ${col} spaces, but its siblings use ${parent.kids}. Items at the same level must line up exactly.`);
  };
  let lastScalar = null;

  for (let i = 0; i < lines.length; i++){
    const raw = lines[i], ln = i + 1;
    if (!raw.trim() || /^\s*#/.test(raw)) continue;
    if (/^ *\t/.test(raw)){ errors.push(`Line ${ln}: a tab is used for indentation. YAML only allows spaces.`); continue; }
    const lineCol = raw.match(/^ */)[0].length;
    let col = lineCol, rest = raw.slice(col).replace(/\s+$/, "");
    if (lastScalar && col > lastScalar.col && (flagged = ln))
      errors.push(`Line ${ln}: indented under "${lastScalar.key}" (line ${lastScalar.ln}), but that key already has a value on its own line.`);
    lastScalar = null;

    let dashNode = null;
    while (/^-(\s|$)/.test(rest)){
      while (stack.length > 1 && (top().col > col || (top().dash && top().col === col))) stack.pop();
      const parent = top();
      sibling(parent, col, ln, "list");
      const n = counters.get(parent) ?? 0; counters.set(parent, n + 1);
      dashNode = {col, gt:[...parent.gt, "[]"], it:[...parent.it, `[${n}]`], kids:null, dash:true};
      stack.push(dashNode);
      const m = rest.match(/^-\s*/)[0].length;
      col += m; rest = rest.slice(m);
    }
    if (!rest) continue;

    let km;
    if (/^['"]/.test(rest)){   // quoted key such as '200':
      const qm = rest.match(/^((['"])(?:(?!\2).)*\2)\s*:(?:\s+(.*))?$/);
      km = qm ? [qm[0], qm[1], qm[3]] : null;
    } else km = rest.match(/^(.+?)\s*:(?:\s+(.*))?$/);
    if (!km){
      if (dashNode) add(dashNode.gt, dashNode.it, cleanVal(rest), ln);
      else errors.push(`Line ${ln}: "${rest.slice(0, 40)}" is not a "key: value" pair or a "- item". Check for a missing colon or a missing space after it.`);
      continue;
    }

    const key = cleanVal(km[1]) || km[1];
    while (stack.length > 1 && top().col >= col) stack.pop();
    const parent = top();
    sibling(parent, col, ln, "map");
    const gt = [...parent.gt, key], it = [...parent.it, key];
    const rawVal = (km[2] || "").trim();

    if (/^[|>][-+]?\d*\s*(#.*)?$/.test(rawVal)){
      const body = []; let j = i + 1;
      for (; j < lines.length; j++){
        const l = lines[j];
        if (!l.trim()){ body.push(""); continue; }
        if (l.match(/^ */)[0].length > lineCol) body.push(l); else break;
      }
      while (body.length && !body[body.length - 1].trim()) body.pop();
      const ind = body.filter(x => x.trim()).map(x => x.match(/^ */)[0].length);
      const min = ind.length ? Math.min(...ind) : 0;
      if (!body.length) errors.push(`Line ${ln}: "${key}: ${rawVal}" starts a multi-line block, but no indented lines follow.`);
      add(gt, it, body.map(x => x.slice(min)).join("\n"), ln, true);
      i = j - 1;
      continue;
    }

    const quoted = /^['"]/.test(rawVal);
    const v = cleanVal(rawVal);
    if (v === "" && !quoted){
      stack.push({col, gt, it, kids:null});
      add(gt, it, "", ln);
    } else if (!quoted && /^\[.*\]$/.test(v)){
      add(gt, it, "", ln);
      splitFlow(v.slice(1, -1)).forEach((x, k) => add([...gt, "[]"], [...it, `[${k}]`], cleanVal(x), ln));
      lastScalar = {col, key, ln};
    } else if (!quoted && /^\{.*\}$/.test(v)){
      add(gt, it, "", ln);
      splitFlow(v.slice(1, -1)).forEach(pair => {
        const pm = pair.match(/^(.+?)\s*:\s*(.*)$/);
        if (pm) add([...gt, cleanVal(pm[1])], [...it, cleanVal(pm[1])], cleanVal(pm[2]), ln);
      });
      lastScalar = {col, key, ln};
    } else {
      add(gt, it, v, ln);
      lastScalar = {col, key, ln};
    }
  }
  return {entries, errors};
}

function globRe(p){
  if (p instanceof RegExp) return p;
  return new RegExp("^" + p.split(/(\*\*|\*|\[\]\?)/).map(s =>
    s === "**" ? ".*" :
    s === "*" ? "[^.\\[\\]]*" :
    s === "[]?" ? "(\\[\\])?" :
    s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("") + "$", "i");
}
const valMatch = (v, w) => w === undefined ? true : w instanceof RegExp ? w.test(v) : String(v).toLowerCase() === String(w).toLowerCase();

function makeApi(entries, src){
  const find = (p, w) => { const re = globRe(p); return entries.filter(e => re.test(e.gen) && valMatch(e.value, w)); };
  return {
    src,
    h: (p, w) => find(p, w).length > 0,
    count: (p, w) => find(p, w).length,
    first: (p, w) => Math.min(Infinity, ...find(p, w).map(e => e.line)),
    item(listPath, conds){
      const re = globRe(listPath + "[]"), groups = new Map();
      for (const e of entries){
        for (let n = 1; n <= e.gt.length; n++){
          if (e.gt[n - 1] !== "[]" || !re.test(toStr(e.gt.slice(0, n)))) continue;
          const k = toStr(e.it.slice(0, n));
          if (!groups.has(k)) groups.set(k, []);
          groups.get(k).push({rel:toStr(e.gt.slice(n)), value:e.value});
        }
      }
      return [...groups.values()].some(list =>
        Object.entries(conds).every(([rp, w]) => { const r = globRe(rp); return list.some(x => r.test(x.rel) && valMatch(x.value, w)); }));
    }
  };
}

/* ===================================================================
   GRADING (pure functions, also used by the self-test)
   =================================================================== */
function stripFor(lang, s){
  s = s.replace(/\r/g, "");
  if (lang === "sh" || lang === "yaml") return s.replace(/^\s*#.*$/gm, "");
  if (lang === "text") return s.replace(/^\s*#\s.*$/gm, "");
  if (lang === "js") return s.replace(/\/\*[\s\S]*?\*\//g, "").replace(/^\s*\/\/.*$/gm, "");
  if (lang === "xml") return s.replace(/<!--[\s\S]*?-->/g, "");
  if (lang === "mermaid") return s.replace(/^\s*%%.*$/gm, "");
  return s;
}

function gradeCode(ex, text){
  const lang = ex.lang || "text";
  const src = stripFor(lang, text);
  const x = {src, raw:text, lines:src.split("\n").map(s => s.trim()).filter(Boolean)};
  const res = [];
  if (lang === "yaml"){
    const p = parseYaml(text);
    x.y = makeApi(p.entries, src);
    res.push({l:"Valid YAML structure: spaces only, aligned siblings, key: value pairs", ok:p.errors.length === 0, sub:p.errors});
  }
  for (const c of ex.checks){
    let ok = false;
    try { ok = !!c.t(x); } catch (err) { ok = false; }
    res.push({l:c.l, ok});
  }
  return res;
}
const normText = v => String(v || "").trim().replace(/\s+/g, " ");
function gradeText(ex, value){ const v = normText(value); return v !== "" && ex.accept.some(r => r.test(v)); }
function gradeChoice(ex, selected){
  const want = [].concat(ex.answer).sort().join(","), got = [...selected].sort().join(",");
  return want === got;
}

/* ===================================================================
   HIGHLIGHTER (tiny, dependency-free)
   =================================================================== */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hlExpr = s => s.replace(/(\$\(\s*[\w.]+\s*\)|\$\{\{[\s\S]*?\}\}|\$\[[\s\S]*?\])/g, '<span class="td">$1</span>');

function commentAt(v){
  let q = null;
  for (let i = 0; i < v.length; i++){
    const ch = v[i];
    if (q){ if (ch === q) q = null; continue; }
    if ((ch === "'" || ch === '"') && (i === 0 || /\s/.test(v[i - 1]))){ q = ch; continue; }
    if (ch === "#" && (i === 0 || /\s/.test(v[i - 1]))) return i;
  }
  return -1;
}
function hlValue(v){
  const ci = commentAt(v);
  const body = ci >= 0 ? v.slice(0, ci) : v, comment = ci >= 0 ? v.slice(ci) : "";
  const t = body.trim();
  let out;
  if (/^(['"]).*\1$/.test(t)) out = `<span class="ts">${hlExpr(esc(body))}</span>`;
  else if (/^[|>][-+]?\d*$/.test(t)) out = `<span class="tk">${esc(body)}</span>`;
  else if (/^(true|false|none|null|~|-?\d+(\.\d+)?)$/i.test(t)) out = `<span class="tn">${esc(body)}</span>`;
  else if (/^[A-Za-z][\w.]*@\d+$/.test(t)) out = `<span class="tt">${esc(body)}</span>`;
  else out = hlExpr(esc(body));
  return out + (comment ? `<span class="tc">${esc(comment)}</span>` : "");
}
function hlYaml(code){
  let blockCol = -1;
  return code.split("\n").map(line => {
    const ind = line.match(/^ */)[0].length;
    if (blockCol >= 0){
      if (!line.trim() || ind > blockCol) return hlExpr(esc(line));
      blockCol = -1;
    }
    const [, sp, dash, rest] = line.match(/^(\s*)((?:-\s+|-$)*)(.*)$/);
    if (rest.startsWith("#")) return esc(sp + dash) + `<span class="tc">${esc(rest)}</span>`;
    let out = esc(sp) + (dash ? `<span class="tdash">${esc(dash)}</span>` : "");
    const km = /^['"]/.test(rest) ? null : rest.match(/^(.+?)(\s*:)(\s+.*)?$/);
    if (km){
      out += `<span class="tk">${hlExpr(esc(km[1]))}</span>${esc(km[2])}`;
      if (km[3]){
        const lead = km[3].match(/^\s*/)[0], val = km[3].slice(lead.length);
        out += lead + hlValue(val);
        if (/^[|>][-+]?\d*\s*(#.*)?$/.test(val.trim())) blockCol = ind;
      }
    } else out += hlValue(rest);
    return out;
  }).join("\n");
}
function hlSh(code){
  return code.split("\n").map(line => {
    const m = line.match(/^(\s*)(#.*)$/);
    if (m) return esc(m[1]) + `<span class="tc">${esc(m[2])}</span>`;
    const ci = commentAt(line), body = ci >= 0 ? line.slice(0, ci) : line, comment = ci >= 0 ? line.slice(ci) : "";
    return esc(body).replace(/^(\s*)(az|gh|git|docfx|dotnet|POST|GET)\b/, '$1<span class="tk">$2</span>')
      .replace(/(\s)(--?[\w-]+)/g, '$1<span class="tt">$2</span>') + (comment ? `<span class="tc">${esc(comment)}</span>` : "");
  }).join("\n");
}
const MERMAID_KW = /^(\s*)(:::\s*mermaid|:::|graph\b.*|flowchart\b.*|sequenceDiagram|gantt|subgraph\b.*|end|section\b.*|participant\b.*|actor\b.*|title\b.*|dateFormat\b.*|excludes\b.*|autonumber|activate\b.*|deactivate\b.*|Note\b.*|alt\b.*|else\b.*|loop\b.*|opt\b.*|par\b.*)$/;
function hlOther(code, lang){
  return code.split("\n").map(line => {
    if (lang === "md" && /^\s*#{1,6}\s/.test(line)) return `<span class="tk">${esc(line)}</span>`;
    if ((lang === "md" || lang === "mermaid") && MERMAID_KW.test(line)) return line.replace(MERMAID_KW, (m, sp, kw) => esc(sp) + `<span class="tk">${esc(kw)}</span>`);
    if (lang === "mermaid" && /^\s*%%/.test(line)) return `<span class="tc">${esc(line)}</span>`;
    if (lang === "js" && /^\s*\/\//.test(line)) return `<span class="tc">${esc(line)}</span>`;
    if (lang === "text" && /^\s*#\s/.test(line)) return `<span class="tc">${esc(line)}</span>`;
    if (lang === "xml") return esc(line).replace(/(&lt;\/?[\w.]+)/g, '<span class="tk">$1</span>');
    return esc(line);
  }).join("\n");
}
function highlight(code, lang){
  if (lang === "yaml") return hlYaml(code);
  if (lang === "sh") return hlSh(code);
  return hlOther(code, lang || "text");
}
function codeBlock(code, lang){
  return `<div class="codewrap"><pre><code>${highlight(code, lang)}</code></pre><button class="copy">Copy</button></div>`;
}

/* ===================================================================
   UI
   =================================================================== */
function startApp(){
  const store = {
    get(k, d){ try { const v = localStorage.getItem("collabLab:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem("collabLab:" + k, JSON.stringify(v)); } catch {} }
  };
  const ALL = MODULES.flatMap(m => m.exercises.map(e => e.id));
  let done = store.get("done", []).filter(id => ALL.includes(id));
  let current = Math.min(store.get("current", 0), MODULES.length - 1);
  const $ = s => document.querySelector(s);
  const KIND = {mcq:"Multiple choice", multi:"Select all that apply", text:"Short answer", code:"Write it"};

  const modDone = m => m.exercises.filter(e => done.includes(e.id)).length;

  function renderNav(){
    let html = "", lastGroup = "";
    MODULES.forEach((m, i) => {
      if (m.group !== lastGroup){ html += `<div class="group">${m.group}</div>`; lastGroup = m.group; }
      const n = modDone(m), all = n === m.exercises.length;
      const cls = [i === current ? "active" : "", all ? "done" : ""].join(" ");
      html += `<button class="${cls}" data-i="${i}"><span class="num">${all ? "✓" : i + 1}</span>${m.title}<span class="cnt">${n}/${m.exercises.length}</span></button>`;
    });
    $("#nav").innerHTML = html;
    $("#bar").style.width = (done.length / ALL.length * 100) + "%";
    $("#progtext").textContent = `${done.length} of ${ALL.length} exercises solved`;
  }

  function markDone(ex, el){
    if (!done.includes(ex.id)){ done.push(ex.id); store.set("done", done); }
    el.classList.add("solved");
    renderNav();
  }

  function exerciseHtml(ex, k, n){
    let body = "";
    if (ex.kind === "mcq" || ex.kind === "multi"){
      const type = ex.kind === "mcq" ? "radio" : "checkbox";
      body = `<div class="opts">${ex.options.map((o, i) =>
        `<label class="opt" data-i="${i}"><input type="${type}" name="o-${ex.id}" value="${i}"><span>${o}</span></label>`).join("")}</div>`;
    } else if (ex.kind === "text"){
      body = `<input class="answer" type="text" spellcheck="false" autocomplete="off" placeholder="${esc(ex.placeholder || "")}" aria-label="Your answer">`;
    } else {
      body = `<textarea spellcheck="false" aria-label="Answer editor"></textarea>
        <p class="edhelp">Tab inserts 2 spaces · Ctrl+Enter checks your answer · your text is saved in this browser</p>`;
    }
    let sol = "";
    if (ex.kind === "code") sol = codeBlock(ex.solution, ex.lang);
    else if (ex.kind === "text") sol = codeBlock(ex.solution, "text");
    return `
      <section class="exercise ${done.includes(ex.id) ? "solved" : ""}" id="ex-${ex.id}">
        <h3>🧪 Exercise ${k + 1} of ${n}: ${ex.title} <span class="badge">Completed</span></h3>
        <div class="kind">${KIND[ex.kind]}</div>
        <div>${ex.task}</div>
        ${body}
        <div class="btns">
          <button class="btn primary" data-act="check">Check my answer</button>
          <button class="btn" data-act="hint">Hint</button>
          <button class="btn" data-act="sol">Show solution</button>
          ${ex.kind === "code" || ex.kind === "text" ? `<button class="btn" data-act="reset">Reset</button>` : ""}
        </div>
        <div class="hint">💡 ${ex.hint || "Re-read the explanation above the exercises."}</div>
        <ul class="results"></ul>
        <div class="why">✅ <b>Why:</b> ${ex.explain}</div>
        <div class="solution">${sol}</div>
      </section>`;
  }

  function wire(ex){
    const el = document.getElementById("ex-" + ex.id);
    const q = s => el.querySelector(s);
    const results = q(".results"), why = q(".why");
    const showWhy = () => { why.style.display = "block"; };
    const key = "ans:" + ex.id;

    let check;
    if (ex.kind === "mcq" || ex.kind === "multi"){
      const opts = [...el.querySelectorAll(".opt")];
      opts.forEach(o => o.querySelector("input").addEventListener("change", () => opts.forEach(x => x.classList.remove("right", "wrong"))));
      check = () => {
        const sel = opts.filter(o => o.querySelector("input").checked).map(o => +o.dataset.i);
        const want = [].concat(ex.answer);
        if (!sel.length){ results.innerHTML = `<li class="fail">✘ Select ${ex.kind === "mcq" ? "an option" : "at least one option"} first.</li>`; return; }
        const ok = gradeChoice(ex, sel);
        opts.forEach(o => {
          const i = +o.dataset.i, picked = sel.includes(i);
          o.classList.toggle("right", picked && want.includes(i));
          o.classList.toggle("wrong", picked && !want.includes(i));
        });
        if (ok){ results.innerHTML = `<li class="pass">✔ Correct. Nice work! 🎉</li>`; showWhy(); markDone(ex, el); }
        else {
          const missing = ex.kind === "multi" && sel.every(i => want.includes(i)) ? " You're on the right track, but something is missing." : "";
          results.innerHTML = `<li class="fail">✘ Not quite.${missing} Try again or take a hint.</li>`;
        }
      };
      q('[data-act="sol"]').onclick = e => {
        const showing = e.target.dataset.on === "1";
        e.target.dataset.on = showing ? "0" : "1";
        e.target.textContent = showing ? "Show solution" : "Hide solution";
        const want = [].concat(ex.answer);
        opts.forEach(o => o.classList.toggle("right", !showing && want.includes(+o.dataset.i)));
        if (!showing) showWhy(); else if (!el.classList.contains("solved")) why.style.display = "none";
      };
    } else {
      const input = q(ex.kind === "text" ? "input.answer" : "textarea");
      const starter = ex.kind === "code" ? ex.starter : "";
      const saved = store.get(key, null);
      input.value = saved !== null ? saved : starter;
      const save = () => store.set(key, input.value);
      input.addEventListener("input", save);
      if (ex.kind === "text"){
        check = () => {
          if (gradeText(ex, input.value)){ results.innerHTML = `<li class="pass">✔ Correct. Nice work! 🎉</li>`; showWhy(); markDone(ex, el); }
          else results.innerHTML = `<li class="fail">✘ Not accepted yet. Check the spelling and format, or take a hint.</li>`;
        };
        input.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); check(); } });
      } else {
        check = () => {
          const res = gradeCode(ex, input.value);
          const passed = res.filter(r => r.ok).length, all = passed === res.length;
          results.innerHTML = res.map(r =>
            `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "✔" : "✘"} ${esc(r.l)}${(r.sub || []).map(s => `<span class="sub">↳ ${esc(s)}</span>`).join("")}</li>`).join("") +
            `<li class="${all ? "pass" : "fail"}"><b>${passed}/${res.length} checks passed${all ? ". Nice work! 🎉" : ""}</b></li>`;
          if (all){ showWhy(); markDone(ex, el); }
        };
        input.addEventListener("keydown", e => {
          if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); check(); return; }
          if (e.key === "Tab" && !e.shiftKey){
            e.preventDefault();
            if (!document.execCommand || !document.execCommand("insertText", false, "  ")){
              const s = input.selectionStart, en = input.selectionEnd;
              input.value = input.value.slice(0, s) + "  " + input.value.slice(en);
              input.selectionStart = input.selectionEnd = s + 2; save();
            }
          }
        });
      }
      q('[data-act="reset"]').onclick = () => { input.value = starter; save(); results.innerHTML = ""; if (!el.classList.contains("solved")) why.style.display = "none"; };
      q('[data-act="sol"]').onclick = e => {
        const s = q(".solution"), show = s.style.display !== "block";
        s.style.display = show ? "block" : "none";
        e.target.textContent = show ? "Hide solution" : "Show solution";
        if (show) showWhy(); else if (!el.classList.contains("solved")) why.style.display = "none";
      };
    }
    q('[data-act="check"]').onclick = check;
    q('[data-act="hint"]').onclick = () => { const h = q(".hint"); h.style.display = h.style.display === "block" ? "none" : "block"; };
    if (el.classList.contains("solved")) showWhy();
  }

  function renderModule(){
    const m = MODULES[current];
    const sections = m.sections.map(s => `
        <h3>${s.h}</h3>
        ${s.p ? `<p>${s.p}</p>` : ""}
        ${s.file ? `<div class="file">${s.file}</div>` : ""}
        ${s.code ? codeBlock(s.code, s.lang) : ""}
        ${s.after || ""}`).join("");
    const n = m.exercises.length;
    $("#content").innerHTML = `
      <span class="tag">Module ${current + 1} of ${MODULES.length} · ${m.tag}</span>
      <h2>${m.title}</h2>
      <p class="lead">${m.intro}</p>
      ${sections}
      ${m.tip ? `<div class="note exam">🎯 <b>AZ-400 exam tip:</b> ${m.tip}</div>` : ""}
      <div class="exhead">Exercises · ${n}</div>
      ${m.exercises.map((ex, k) => exerciseHtml(ex, k, n)).join("")}
      <div class="navfoot">
        <button class="btn" id="prevBtn" ${current === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn" id="nextBtn" ${current === MODULES.length - 1 ? "disabled" : ""}>Next →</button>
      </div>`;
    m.exercises.forEach(wire);
    $("#prevBtn").onclick = () => go(current - 1);
    $("#nextBtn").onclick = () => go(current + 1);
    renderNav();
    window.scrollTo(0, 0);
  }

  function go(i){
    if (i < 0 || i >= MODULES.length) return;
    current = i; store.set("current", i);
    $("#side").classList.remove("open");
    renderModule();
  }

  $("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
  $("#menuBtn").onclick = () => $("#side").classList.toggle("open");
  document.addEventListener("click", e => {
    if (!e.target.classList.contains("copy")) return;
    const text = e.target.previousElementSibling.innerText;
    navigator.clipboard?.writeText(text).then(() => { e.target.textContent = "Copied!"; setTimeout(() => e.target.textContent = "Copy", 1200); });
  });
  $("#themeBtn").onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme);
  };
  const t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t;

  renderModule();
}

if (typeof document !== "undefined" && document.getElementById("content")) startApp();
</script>
</body>
</html>
