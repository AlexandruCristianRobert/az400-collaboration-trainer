<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collaboration &amp; Communication Practice Lab</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1d2330; --muted:#5d6678; --line:#e1e5ec;
  --accent:#0f6cbd; --accent-soft:#e6f0fa; --ok:#127a3c; --ok-soft:#e5f5eb; --bad:#b42318; --bad-soft:#fdecea;
  --warn:#a35200; --warn-soft:#fdf1e3;
  --code-bg:#0f1720; --code-text:#d6dde8;
  --k:#7cc4ff; --s:#f2b880; --c:#7d8a9c; --d:#d7a6ff; --n:#9fe3a8; --t:#6fd6c9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#161b22; --text:#e3e8ef; --muted:#9aa4b2; --line:#2a313c;
    --accent:#4ea1f3; --accent-soft:#16283c; --ok:#4cc27a; --ok-soft:#13281c; --bad:#ff7b72; --bad-soft:#2d1615;
    --warn:#f0b450; --warn-soft:#2b2112;
    --code-bg:#0a0d12;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161b22; --text:#e3e8ef; --muted:#9aa4b2; --line:#2a313c;
  --accent:#4ea1f3; --accent-soft:#16283c; --ok:#4cc27a; --ok-soft:#13281c; --bad:#ff7b72; --bad-soft:#2d1615;
  --warn:#f0b450; --warn-soft:#2b2112;
  --code-bg:#0a0d12;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,pre,textarea,input.answer{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:18px;margin:0 8px 4px}
aside .sub{color:var(--muted);font-size:13px;margin:0 8px 14px}
.progress{height:6px;background:var(--line);border-radius:4px;margin:0 8px 6px;overflow:hidden}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.progtext{font-size:12px;color:var(--muted);margin:0 8px 14px}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--text);
  padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--accent-soft)}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .num{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
nav button.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px}
.sidefoot{margin:18px 8px 0;display:grid;gap:10px;justify-items:start}
.sidefoot a{font-size:13px;color:var(--accent)}
.theme{font-size:13px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
main{padding:32px 40px 80px;max-width:980px;width:100%}
.tag{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:20px;margin-bottom:8px}
h2{font-size:28px;margin:0 0 8px}
h3{font-size:19px;margin:28px 0 8px}
p{margin:8px 0}
.lead{color:var(--muted);font-size:17px}
:not(pre)>code{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.9em;overflow-wrap:anywhere}
.codewrap{position:relative;margin:12px 0}
pre{background:var(--code-bg);color:var(--code-text);padding:16px 18px;border-radius:10px;overflow:auto;font-size:14px;line-height:1.55;margin:0}
.file{font-size:12px;color:var(--muted);margin:12px 0 -6px;font-family:Consolas,monospace}
.copy{position:absolute;top:8px;right:8px;font-size:12px;background:#ffffff1a;color:#cfd8e3;border:0;border-radius:6px;padding:4px 9px;cursor:pointer}
.copy:hover{background:#ffffff33}
.tk{color:var(--k)} .ts{color:var(--s)} .tc{color:var(--c);font-style:italic} .td{color:var(--d)} .tn{color:var(--n)} .tt{color:var(--t)}
.tdash{color:var(--c)}
ul.tips,ol.tips{padding-left:20px} .tips li{margin:4px 0}
table.ref{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0;display:block;overflow-x:auto}
table.ref th,table.ref td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.ref th{background:var(--accent-soft);font-weight:600}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;font-size:15px}
.note.exam{border-left-color:var(--warn);background:var(--warn-soft)}
.exercise{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.exercise h3{margin-top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exercise h3 .badge{font-size:12px;background:var(--ok);color:#fff;border-radius:20px;padding:2px 10px;display:none}
.exercise.solved h3 .badge{display:inline-block}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:-4px 0 8px}
.exhead{margin-top:36px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
textarea{width:100%;min-height:220px;background:var(--code-bg);color:var(--code-text);border:1px solid var(--line);border-radius:10px;
  padding:14px;font-size:14px;line-height:1.55;resize:vertical;tab-size:2;outline:none;white-space:pre;overflow:auto;margin-top:10px}
textarea:focus,input.answer:focus{border-color:var(--accent)}
input.answer{width:100%;background:var(--code-bg);color:var(--code-text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;outline:none;margin-top:10px}
.edhelp{font-size:12px;color:var(--muted);margin:4px 0 0}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;flex:0 0 auto}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.results{list-style:none;padding:0;margin:10px 0}
.results li{padding:6px 12px;border-radius:7px;margin:4px 0;font-size:14px}
.results li.pass{background:var(--ok-soft);color:var(--ok)}
.results li.fail{background:var(--bad-soft);color:var(--bad)}
.results li .sub{display:block;font-size:13px;margin:2px 0 0 18px;opacity:.9}
.hint{display:none;background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-size:15px;margin:8px 0}
.why{display:none;border-left:3px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:15px}
.solution{display:none}
.navfoot{display:flex;justify-content:space-between;margin-top:30px}
.menu{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset:0 30% 0 0;z-index:5;transform:translateX(-105%);transition:transform .2s;height:100vh}
  aside.open{transform:none;box-shadow:0 0 40px #0006}
  main{padding:16px 16px 60px}
  .menu{display:inline-block;margin-bottom:12px}
  h2{font-size:23px}
}
</style>
</head>

<script>
/* ===================================================================
   MODULE DATA
   - Each module has a short explanation (sections) and several exercises.
   - Exercise kinds:
       mcq    one correct option       { options, answer: index }
       multi  select all that apply    { options, answer: [indexes] }
       text   one-line answer          { accept: [RegExp], solution }
       code   editor with checks       { lang, starter, checks: [{l, t: x => bool}], solution }
     For code checks, x = { src (comments removed), raw, lines (trimmed, non-empty), y (YAML api, yaml only) }.
     Text answers are trimmed and runs of whitespace collapsed before matching.
   - Optional alts / bad arrays hold extra answers the self-test expects
     to be accepted / rejected.
   - ${{ ... }} and shell ${VAR} are written as \${...} inside template literals.
     Markdown code fences use ${FENCE}.
   =================================================================== */
const FENCE = "```";
const MODULES = [
/* ================================================================ 1 */
{
  group:"Document",
  title:"Azure DevOps wikis",
  tag:"Provisioned wiki · code wiki · permissions",
  intro:`Azure DevOps has two kinds of wiki. Both store pages as Markdown files in a <b>Git repository</b>, but they're created, edited, ordered and versioned differently. The exam likes to ask which one fits a scenario.`,
  sections:[
    {h:"Provisioned wiki vs. publish code as wiki", p:`You create the <b>project wiki</b> from <b>Overview → Wiki → Create project wiki</b>. You create a <b>code wiki</b> from <b>Wiki → Publish code as wiki</b> and point it at a folder and branch in an Azure Repos Git repo.`,
     after:`<table class="ref">
      <tr><th></th><th>Provisioned (project) wiki</th><th>Published code wiki</th></tr>
      <tr><td>How many</td><td>One per project</td><td>As many as you like, each with its own name</td></tr>
      <tr><td>Where the files live</td><td>A Git repo created for the wiki, <code>&lt;Project&gt;.wiki</code>, branch <code>wikiMaster</code></td><td>A folder in an existing Azure Repos Git repo, on a branch you choose</td></tr>
      <tr><td>Editing</td><td>In the wiki editor; each save commits to <code>wikiMaster</code>. You can also clone the wiki repo.</td><td>In the wiki (<b>Edit in Repos</b>) or with a normal Git workflow: branch, pull request, branch policies. Changes to the published branch publish automatically.</td></tr>
      <tr><td>Page order</td><td>Managed for you when you drag pages in the tree</td><td>You maintain <code>.order</code> files by hand. Without one, pages sort alphabetically.</td></tr>
      <tr><td>Versions</td><td>Page revisions, with a <b>Revert</b> option on the wiki page</td><td>Publish extra branches (for example <code>release/2.0</code>) as <b>versions</b> that readers switch between. Revert via Git or a pull request.</td></tr>
      <tr><td>Unpublish / delete</td><td>No REST delete for the wiki itself. You delete its Git repository.</td><td><b>Unpublish</b> removes the wiki and leaves the files in the repo. Only the user who published it can version or unpublish it.</td></tr>
     </table>`},
    {h:"The files behind the pages", lang:"text", code:`/                         wiki root (or the mapped folder of a code wiki)
├─ .order                 page order at this level, one page name per line
├─ .attachments/          images and files pasted into pages
├─ Home.md
├─ Getting-Started.md     page "Getting Started": spaces in titles become hyphens
└─ Getting-Started/       subpages live in a folder with the same name
   ├─ .order
   └─ Install-Tools.md`,
     p:`Because a hyphen in a file name means a space, a real hyphen in a page title is encoded as <code>%2D</code> in the file name. A <code>.order</code> file lists the page file names <b>without</b> the <code>.md</code> extension.`},
    {h:"Wiki-only Markdown extras", lang:"md", code:`[[_TOC_]]              table of contents (case-sensitive; first instance only)
[[_TOSP_]]             table of subpages ("Child Pages")
#1234                  link to work item 1234
@<{identity-guid}>     an @mention as stored in the file (type @ in the editor to pick someone)

::: mermaid
graph LR
  A --> B
:::

:::
query-table 6ff7777e-8ca5-4f04-a7f6-9e63737dddf7
:::`,
     p:`You can also use HTML such as <code>&lt;details&gt;&lt;summary&gt;</code> for collapsible sections, and <code>::: video</code> to embed YouTube or Microsoft Stream videos. Markdown in Azure DevOps doesn't run JavaScript and doesn't allow general iframes.`},
    {h:"Permissions and automation", p:`Wiki permissions are Git repository permissions. Open <b>More options (…) → Wiki security</b> to set them per group. By default <b>Contributors</b> can edit and <b>Readers</b> can only read. Publishing code as a wiki needs the <b>Create repository</b> permission, which Project Administrators have by default. You can script wikis with the Azure DevOps CLI extension:`,
     lang:"sh", code:`az devops configure --defaults organization=https://dev.azure.com/contoso project=Fabrikam

az devops wiki create --name "Fabrikam.wiki" --type projectwiki
az devops wiki create --name "Shop API docs" --type codewiki \\
  --repository shop-api --mapped-path /docs --version main

az devops wiki page create --wiki "Shop API docs" --path "Release notes" --file-path notes.md
az devops wiki list`}
  ],
  tip:`Look for clues in the wording. <i>"Docs next to the code"</i>, <i>"reviewed in pull requests"</i>, <i>"a version per release"</i> or <i>"several wikis"</i> point to <b>publish code as wiki</b>. <i>"A quick team knowledge base edited in the browser"</i> points to the <b>provisioned</b> project wiki.`,
  exercises:[
    {id:"wiki-choose", kind:"mcq", title:"Pick the right wiki",
     task:`Your team keeps product docs in the <code>docs/</code> folder of the <code>shop-api</code> repo. Doc changes must go through pull requests with the same branch policies as code, and readers must be able to switch between the docs for release 1.0 and release 2.0. What do you configure?`,
     options:[
       `Create the project wiki and copy the <code>docs/</code> folder into it before every release`,
       `Create two provisioned wikis, one per release`,
       `Publish <code>docs/</code> as a code wiki from <code>main</code>, then publish <code>release/1.0</code> and <code>release/2.0</code> as additional versions`,
       `Publish the docs as a Universal Package in Azure Artifacts`],
     answer:2,
     hint:`Which wiki type is just a view over a folder in a normal repo, with branch policies and versions?`,
     explain:`A <b>code wiki</b> is a view over a folder in a normal repo, so edits follow the usual branch → pull request → policy flow. Its <b>versions</b> feature publishes other branches so readers can switch between them. A project can only have <b>one</b> provisioned wiki, and that wiki has no versions.`},
    {id:"wiki-facts", kind:"mcq", title:"Provisioned wiki facts",
     task:`Which statement about the provisioned (project) wiki is true?`,
     options:[
       `You can create as many project wikis as you need in one project`,
       `Its pages are stored in a Git repo named <code>&lt;Project&gt;.wiki</code>, on the branch <code>wikiMaster</code>`,
       `You must maintain <code>.order</code> files by hand to sort the pages`,
       `You can publish other branches of it as versions`],
     answer:1,
     hint:`Three of the four options describe the code wiki.`,
     explain:`The project wiki is backed by its own Git repo (<code>&lt;Project&gt;.wiki</code>, branch <code>wikiMaster</code>). You can clone it and work offline. Manual <code>.order</code> files, versions and multiple wikis are all features of the <b>published code wiki</b>.`},
    {id:"wiki-cli", kind:"code", lang:"sh", title:"Publish a code wiki from the CLI",
     task:`Write one Azure DevOps CLI command that publishes the <code>/docs</code> folder of the repo <code>shop-api</code>, branch <code>main</code>, as a code wiki named <code>Shop API docs</code>. Assume the organization and project defaults are already configured.`,
     starter:`# az devops ...
`,
     checks:[
       {l:"Uses az devops wiki create", t:x => /az\s+devops\s+wiki\s+create\b/.test(x.src)},
       {l:"Type is codewiki", t:x => /--type\s+["']?codewiki["']?(\s|$)/i.test(x.src)},
       {l:"Repository is shop-api", t:x => /(--repository|-r)\s+["']?shop-api["']?(\s|$)/.test(x.src)},
       {l:"Mapped path is /docs", t:x => /--mapped-path\s+["']?\/?docs\/?["']?(\s|$)/.test(x.src)},
       {l:"Version (branch) is main", t:x => /(--version|-v)\s+["']?main["']?(\s|$)/.test(x.src)},
       {l:"Name is \"Shop API docs\"", t:x => /--name\s+(["'])Shop API docs\1/.test(x.src)}
     ],
     hint:`<code>az devops wiki create --name ... --type codewiki --repository ... --mapped-path ... --version ...</code>. Quote the name because it contains spaces.`,
     solution:`az devops wiki create --name "Shop API docs" --type codewiki \\
  --repository shop-api --mapped-path /docs --version main`,
     alts:[`az devops wiki create -r shop-api --type codewiki --version main --mapped-path "/docs" --name 'Shop API docs'`],
     explain:`For a code wiki, <code>--repository</code>, <code>--mapped-path</code> and <code>--version</code> (the branch) are required. For <code>--type projectwiki</code> you only give a name. Publishing extra branches as versions happens later, from the wiki UI or the REST API.`},
    {id:"wiki-order", kind:"code", lang:"text", title:"Order the pages of a code wiki",
     task:`Your code wiki root has <code>Architecture-Overview.md</code>, <code>Getting-Started.md</code>, <code>Home.md</code> and <code>Release-Notes.md</code>. They show up alphabetically. Write the root <code>.order</code> file so the navigation shows <b>Home, Getting Started, Architecture Overview, Release Notes</b>.`,
     starter:``,
     checks:[
       {l:"Exactly four entries", t:x => x.lines.length === 4},
       {l:"No .md extensions", t:x => x.lines.length > 0 && x.lines.every(l => !/\.md$/i.test(l))},
       {l:"Spaces written as hyphens (file names, not titles)", t:x => x.lines.length > 0 && x.lines.every(l => !/\s/.test(l))},
       {l:"Correct order: Home, Getting-Started, Architecture-Overview, Release-Notes", t:x => x.lines.join("|").replace(/\.md/gi, "") === "Home|Getting-Started|Architecture-Overview|Release-Notes"}
     ],
     hint:`One page per line, using the file name without <code>.md</code>.`,
     solution:`Home
Getting-Started
Architecture-Overview
Release-Notes`,
     bad:[`Home\nGetting Started\nArchitecture Overview\nRelease Notes`],
     explain:`The <code>.order</code> file contains file names, one per line, without the <code>.md</code> extension. Pages it doesn't list appear after the listed ones, sorted alphabetically. In the provisioned wiki these files are kept up to date for you when you drag pages around.`},
    {id:"wiki-toc", kind:"text", title:"Table of contents tag",
     task:`Which tag do you put on an Azure DevOps wiki page to render a table of contents built from its headings? Type it exactly.`,
     placeholder:"[[...]]",
     accept:[/^\[\[_TOC_\]\]$/],
     solution:`[[_TOC_]]`,
     bad:[`[[_toc_]]`, `[TOC]`],
     hint:`Double square brackets, underscores, capital letters.`,
     explain:`<code>[[_TOC_]]</code> is case-sensitive. The lowercase <code>[[_toc_]]</code> might not render. Only the first instance on a page is used, and only <code>#</code>-style Markdown headings are picked up. Its sibling <code>[[_TOSP_]]</code> renders a table of subpages.`}
  ]
},
/* ================================================================ 2 */
{
  group:"Document",
  title:"Markdown",
  tag:"Tables · task lists · anchors · mentions",
  intro:`READMEs, pull request descriptions, wikis and GitHub issues all use Markdown. The core syntax is the same everywhere. Each platform adds its own extras for mentions, work item links and callouts.`,
  sections:[
    {h:"Tables and alignment", lang:"md", code:`| Environment | URL                      | Approver |
|:------------|:------------------------:|---------:|
| Test        | https://test.contoso.com | Ops      |
| Production  | https://www.contoso.com  | CAB      |`,
     p:`The <b>separator row</b> under the header is required. Without it you get plain text. Colons set the alignment: <code>:---</code> left, <code>:---:</code> centre, <code>---:</code> right. The cells don't have to line up, and the outer pipes are optional.`},
    {h:"Task lists, mentions and references", after:`<table class="ref">
      <tr><th></th><th>GitHub</th><th>Azure DevOps</th></tr>
      <tr><td>Task list</td><td><code>- [ ] todo</code> · <code>- [x] done</code></td><td>Same syntax, supported in pull requests and wikis</td></tr>
      <tr><td>Mention a person or team</td><td><code>@octocat</code>, <code>@org/team</code></td><td>Type <code>@</code> and pick someone. Wiki files store it as <code>@&lt;{identity-guid}&gt;</code>.</td></tr>
      <tr><td>Issue / work item</td><td><code>#42</code> = issue or PR in the repo · <code>AB#42</code> = Azure Boards work item (needs the Azure Boards app)</td><td><code>#42</code> = work item 42</td></tr>
      <tr><td>Pull request</td><td><code>#42</code></td><td><code>!42</code></td></tr>
      <tr><td>Heading link</td><td><code>[Setup](#setup)</code>, or <code>[Setup](docs/setup.md#install)</code> for another file</td><td>Same idea</td></tr>
     </table>`},
    {h:"Heading anchors", p:`Every heading gets an anchor ID. <b>GitHub</b> lowercases the text, removes punctuation (except <code>-</code> and <code>_</code>) and turns spaces into hyphens. Duplicate headings get <code>-1</code>, <code>-2</code>… <b>Azure DevOps</b> also lowercases and hyphenates, but it turns most punctuation into hyphens instead of removing it. For example, <code>#### Team #1 : Release Wiki!</code> becomes <code>#team-1--release-wiki</code>. When in doubt, check the rendered HTML.`,
     lang:"md", code:`## Deploy to production
...
See [how we deploy](#deploy-to-production).`},
    {h:"GitHub alerts and collapsible sections", lang:"md", code:`> [!NOTE]
> Useful information users should know.

> [!WARNING]
> Urgent info that needs immediate attention.

<details>
<summary>Show the full log</summary>

Markdown works in here **after a blank line**.

</details>`,
     p:`GitHub alerts come in five types: <code>NOTE</code>, <code>TIP</code>, <code>IMPORTANT</code>, <code>WARNING</code> and <code>CAUTION</code>. <code>&lt;details&gt;</code> also works in Azure DevOps wikis, which require a blank line after <code>&lt;/summary&gt;</code>.`}
  ],
  tip:`Know which reference syntax works where. In GitHub text, <code>#123</code> is a GitHub issue or PR and <code>AB#123</code> is an Azure Boards work item. In Azure DevOps text, <code>#123</code> is a work item and <code>!123</code> is a pull request.`,
  exercises:[
    {id:"md-table", kind:"code", lang:"md", title:"Build an aligned table",
     task:`Write a Markdown table with the columns <code>Service</code>, <code>Owner</code> and <code>SLA</code>. Left-align <b>Service</b>, centre <b>Owner</b> and right-align <b>SLA</b>. Add at least two data rows.`,
     starter:``,
     checks:[
       {l:"Header row: Service | Owner | SLA", t:x => /^\|?\s*Service\s*\|\s*Owner\s*\|\s*SLA\s*\|?\s*$/mi.test(x.src)},
       {l:"Separator row directly under the header", t:x => /^\|?\s*Service\s*\|\s*Owner\s*\|\s*SLA\s*\|?[ \t]*\n\|?\s*:?-+:?\s*\|\s*:?-+:?\s*\|\s*:?-+:?\s*\|?[ \t]*$/mi.test(x.src)},
       {l:"Alignment: left, centre, right", t:x => /^\|?\s*:-+\s*\|\s*:-+:\s*\|\s*-+:\s*\|?[ \t]*$/m.test(x.src)},
       {l:"At least two data rows with three cells", t:x => {
          const rows = x.lines.filter(l => !/^\|?\s*:?-+:?\s*\|/.test(l) && !/Service\s*\|\s*Owner/i.test(l))
            .filter(l => l.replace(/^\||\|$/g, "").split("|").length === 3);
          return rows.length >= 2; }}
     ],
     hint:`Left <code>:---</code>, centre <code>:---:</code>, right <code>---:</code>. The separator row goes directly under the header.`,
     solution:`| Service  | Owner     |   SLA |
|:---------|:---------:|------:|
| Checkout | Team Pay  | 99.95 |
| Search   | Team Find |  99.9 |`,
     alts:[`Service|Owner|SLA\n:--|:-:|--:\nA|B|1\nC|D|2`],
     explain:`GitHub, Azure DevOps wikis, READMEs and PR descriptions all render this the same way. Without the separator row it's just text with pipes. Right-aligning numeric columns such as an SLA makes them easier to scan.`},
    {id:"md-fix", kind:"code", lang:"md", title:"Fix the broken README section",
     task:`This snippet renders badly. Fix it so that: the heading renders, the table renders, all three checklist items are real task-list items (keep "Request access" checked), and the FAQ link points at the <code>#faq</code> anchor.`,
     starter:`##Setup steps
| Step | Owner |
| Install tools | Dev |
| Configure pipeline | Ops |

-[] Create service connection
- [X] Request access
* [ ]Add branch policy

See [the FAQ] (#faq).
`,
     checks:[
       {l:"Heading has a space after ##", t:x => /^##\s+Setup steps\s*$/m.test(x.src)},
       {l:"Table has a separator row under the header", t:x => /^\|?\s*Step\s*\|\s*Owner\s*\|?[ \t]*\n\|?\s*:?-+:?\s*\|\s*:?-+:?\s*\|?[ \t]*$/m.test(x.src)},
       {l:"Unchecked task: Create service connection", t:x => /^\s*[-*+] \[ \] Create service connection/m.test(x.src)},
       {l:"Checked task: Request access", t:x => /^\s*[-*+] \[[xX]\] Request access/m.test(x.src)},
       {l:"Unchecked task: Add branch policy", t:x => /^\s*[-*+] \[ \] Add branch policy/m.test(x.src)},
       {l:"Link written as [the FAQ](#faq) with no space", t:x => /\[the FAQ\]\(#faq\)/.test(x.src)}
     ],
     hint:`Headings need a space after the hashes. Task items are <code>- [ ] text</code>: a space inside the brackets and a space after them. A link has no space between <code>]</code> and <code>(</code>.`,
     solution:`## Setup steps
| Step | Owner |
|------|-------|
| Install tools | Dev |
| Configure pipeline | Ops |

- [ ] Create service connection
- [x] Request access
- [ ] Add branch policy

See [the FAQ](#faq).`,
     explain:`These four mistakes come up all the time in PR reviews. <code>##Setup</code> isn't a heading in CommonMark. A table needs its separator row. <code>-[]</code> and <code>[ ]Add</code> aren't task items. <code>[text] (url)</code> isn't a link. Uppercase <code>[X]</code> is fine.`},
    {id:"md-anchor", kind:"text", title:"Link to a heading on GitHub",
     task:`A README on GitHub has the heading <code>## Deploy to Azure: Step 2!</code>. What anchor do you link to? (You can type just the anchor, such as <code>#something</code>.)`,
     placeholder:"#...",
     accept:[/^(\[[^\]]*\]\()?#?deploy-to-azure-step-2\)?$/],
     solution:`#deploy-to-azure-step-2`,
     alts:[`[Step 2](#deploy-to-azure-step-2)`, `deploy-to-azure-step-2`],
     bad:[`#Deploy-to-Azure:-Step-2!`, `#deploy-to-azure--step-2-`],
     hint:`Lowercase, drop the punctuation, spaces become hyphens.`,
     explain:`GitHub lowercases the text, drops <code>:</code> and <code>!</code> and replaces spaces with hyphens, giving <code>#deploy-to-azure-step-2</code>. Azure DevOps turns punctuation into hyphens instead of removing it, so the same heading gets a different ID there.`},
    {id:"md-refs", kind:"mcq", title:"References in a GitHub pull request",
     task:`You're writing a pull request description in a GitHub repo that is connected to Azure Boards. You want to link GitHub issue 17 and Azure Boards work item 42, and notify the <code>docs</code> team of the <code>contoso</code> organization. What do you write?`,
     options:[
       `<code>#17 #42 @docs</code>`,
       `<code>#17 AB#42 @contoso/docs</code>`,
       `<code>!17 AB#42 @contoso/docs</code>`,
       `<code>GH#17 #42 @contoso/docs</code>`],
     answer:1,
     hint:`In GitHub text, <code>#</code> means GitHub. Azure Boards needs a prefix.`,
     explain:`On GitHub, <code>#17</code> links issue or PR 17 in the same repo. <code>AB#42</code> links Azure Boards work item 42 (the Azure Boards app must be connected). A team mention is <code>@org/team-slug</code>. <code>!17</code> is the Azure DevOps pull request syntax.`},
    {id:"md-alert", kind:"code", lang:"md", title:"Alert plus a collapsible section",
     task:`For a GitHub README, write a <b>WARNING</b> alert with the text <i>Rotating this secret restarts the app.</i> Below it, add a collapsible section with the summary <code>Rotation steps</code>. It should contain a numbered list with at least two steps. Leave a blank line after the summary so the Markdown inside renders.`,
     starter:``,
     checks:[
       {l:"Alert opens with > [!WARNING]", t:x => /^>\s*\[!WARNING\]\s*$/m.test(x.src)},
       {l:"Alert text on a following > line", t:x => /^>\s*\[!WARNING\]\s*\n>\s*\S/m.test(x.src)},
       {l:"<details> with <summary>Rotation steps</summary>", t:x => /<details>\s*<summary>\s*Rotation steps\s*<\/summary>/i.test(x.src)},
       {l:"Blank line after </summary>", t:x => /<\/summary>[ \t]*\n[ \t]*\n/i.test(x.src)},
       {l:"Numbered list with 2+ items inside the details", t:x => { const m = x.src.match(/<\/summary>([\s\S]*?)<\/details>/i); return !!m && (m[1].match(/^\s*\d+\.\s+\S/gm) || []).length >= 2; }},
       {l:"Closes with </details>", t:x => /<\/details>/i.test(x.src)}
     ],
     hint:`An alert is a blockquote whose first line is <code>> [!WARNING]</code>. Collapsible: <code>&lt;details&gt;&lt;summary&gt;…&lt;/summary&gt;</code>, a blank line, the content, then <code>&lt;/details&gt;</code>.`,
     solution:`> [!WARNING]
> Rotating this secret restarts the app.

<details>
<summary>Rotation steps</summary>

1. Create the new secret version in Key Vault.
2. Restart the app and verify the health endpoint.

</details>`,
     explain:`Alerts are a GitHub Markdown extension and render with an icon and colour. <code>&lt;details&gt;</code> is plain HTML, so it works on GitHub and in Azure DevOps wikis. Without the blank line after <code>&lt;/summary&gt;</code>, the Markdown inside is shown as raw text.`}

{
  group:"Document",
  title:"Mermaid diagrams",
  tag:"Flowchart · sequence · Gantt",
  intro:`Mermaid turns text into diagrams. Because the diagram is text, it's versioned with the docs, shows up in diffs and is reviewed in pull requests. Binary images in an attachments folder get none of that.`,
  sections:[
    {h:"Where Mermaid renders", after:`<table class="ref">
      <tr><th>Platform</th><th>Syntax</th><th>Notes</th></tr>
      <tr><td>GitHub (Markdown files, issues, PRs, discussions, wikis)</td><td>a <code>${FENCE}mermaid</code> code block</td><td>Current Mermaid version</td></tr>
      <tr><td>Azure DevOps wiki</td><td><code>::: mermaid</code> … <code>:::</code> or a <code>${FENCE}mermaid</code> block</td><td>Limited syntax: <b>use <code>graph</code>, not <code>flowchart</code></b>. Long arrows like <code>----></code> and most HTML tags aren't supported.</td></tr>
     </table>
     <p>The Azure DevOps wiki supports sequence, Gantt, flowchart (<code>graph</code>), class, state, user journey, pie, requirement, Git graph, entity relationship and timeline diagrams.</p>`},
    {h:"Flowchart", lang:"mermaid", code:`graph TD
    A[Push feature branch] --> B{Build OK?}
    B -- Yes --> C(Open pull request)
    B -- No --> A
    C -->|approved| D[(Merge to main)]
    C -.-> E((Demo))
    subgraph Release
      D ==> F[Deploy]
    end`,
     p:`Direction: <code>TD</code>/<code>TB</code>, <code>BT</code>, <code>LR</code>, <code>RL</code>. Shapes: <code>[rect]</code>, <code>(rounded)</code>, <code>{decision}</code>, <code>((circle))</code>, <code>[(database)]</code>. Links: <code>--></code> arrow, <code>---</code> line, <code>-.-></code> dotted, <code>==></code> thick. Add a label with <code>-- text --></code> or <code>-->|text|</code>.`},
    {h:"Sequence diagram", lang:"mermaid", code:`sequenceDiagram
    autonumber
    actor Dev as Developer
    participant GH as GitHub
    participant CI as Azure Pipelines
    Dev->>GH: git push
    GH->>CI: webhook (push event)
    activate CI
    CI-->>GH: commit status: pending
    alt build succeeds
        CI-->>GH: status: success
    else build fails
        CI-->>GH: status: failure
    end
    deactivate CI
    Note over Dev,GH: The check shows on the pull request`,
     p:`Messages are <code>From&lt;arrow&gt;To: text</code>. <code>-></code> solid line without an arrowhead, <code>--></code> dotted without one, <code>->></code> solid with an arrowhead, <code>-->></code> dotted with an arrowhead (typically a reply), <code>-x</code> ends in a cross, <code>-)</code> async. Blocks: <code>loop</code>, <code>alt/else</code>, <code>opt</code>, <code>par</code>, each closed with <code>end</code>.`},
    {h:"Gantt chart", lang:"mermaid", code:`gantt
    title Release 2.0
    dateFormat YYYY-MM-DD
    excludes weekends
    section Build
    Feature work      :done, feat, 2026-03-02, 10d
    Hardening         :active, hard, after feat, 5d
    section Release
    Release candidate :crit, rc, after hard, 2d
    Go live           :milestone, live, after rc, 0d`,
     p:`Task syntax: <code>Name :[tags,] [id,] start, duration-or-end</code>. Tags: <code>done</code>, <code>active</code>, <code>crit</code>, <code>milestone</code>. The start can be a date in the <code>dateFormat</code> or <code>after &lt;id&gt;</code>.`}
  ],
  tip:`Typical exam scenario: "Process diagrams must be kept in source control and reviewed like code" → Mermaid in the wiki or README. In an Azure DevOps wiki, remember <code>::: mermaid</code> and the <code>graph</code> keyword.`,
  exercises:[
    {id:"mm-flow", kind:"code", lang:"mermaid", title:"Pull request flow for an Azure DevOps wiki",
     task:`Draw this flow on an Azure DevOps wiki page: <i>Push branch</i> → decision <i>Build passes?</i> → <b>Yes</b>: <i>Code review</i> → <i>Merge to main</i>. <b>No</b>: back to <i>Push branch</i>.
       <ul class="tips"><li>Use the <code>::: mermaid</code> container</li><li>Top-down, using the keyword Azure DevOps supports</li><li>A decision node, with the two edges labelled <code>Yes</code> and <code>No</code></li></ul>`,
     starter:``,
     checks:[
       {l:"Wrapped in ::: mermaid … :::", t:x => /^:::\s*mermaid\s*$[\s\S]*^:::\s*$/m.test(x.src)},
       {l:"Uses graph TD (or TB), not flowchart", t:x => /^\s*graph\s+(TD|TB)\s*;?\s*$/m.test(x.src) && !/^\s*flowchart\b/m.test(x.src)},
       {l:"Has a decision node {…}", t:x => /\w+\{[^}\n]+\}/.test(x.src)},
       {l:"An edge labelled Yes", t:x => /--\s*Yes\s*-->|-->\s*\|\s*Yes\s*\|/i.test(x.src)},
       {l:"An edge labelled No", t:x => /--\s*No\s*-->|-->\s*\|\s*No\s*\|/i.test(x.src)},
       {l:"At least four arrows (including the loop back)", t:x => (x.src.match(/-->/g) || []).length >= 4},
       {l:"No unsupported long arrows (---->)", t:x => !/---->/.test(x.src)}
     ],
     hint:`<code>B{Build passes?} -- Yes --> C[Code review]</code>. To loop back, point an arrow at the first node's ID.`,
     solution:`::: mermaid
graph TD
    A[Push branch] --> B{Build passes?}
    B -- Yes --> C[Code review]
    C --> D[Merge to main]
    B -- No --> A
:::`,
     alts:[`::: mermaid\ngraph TB\n  push[Push branch] --> ok{Build passes?}\n  ok -->|Yes| rev[Code review]\n  rev --> merge[Merge to main]\n  ok -->|No| push\n:::`],
     explain:`The Azure DevOps wiki documents <code>flowchart</code> as unsupported, so use <code>graph</code>. Node IDs (A, B…) are what edges connect. The text in brackets is only the label. That's why you loop back with <code>B -- No --> A</code> instead of repeating the label.`},
    {id:"mm-seq", kind:"code", lang:"md", title:"Fix a sequence diagram for GitHub",
     task:`This diagram should render in a GitHub README. Fix it:
       <ul class="tips"><li>wrap it in a <code>${FENCE}mermaid</code> fence</li><li>requests use a solid arrow with an arrowhead, and the reply uses a dotted arrow with an arrowhead</li><li>every message needs a <code>: text</code> label</li><li>add a note over <code>Hook</code> saying <i>verify signature</i></li></ul>`,
     starter:`sequenceDiagram
    participant Dev
    participant GH as GitHub
    participant Hook as Webhook receiver
    Dev -> GH: git push
    GH ->> Hook POST /webhook
    Hook ->> GH 200 OK
`,
     checks:[
       {l:"Opens with a ```mermaid fence and closes it", t:x => /^```\s*mermaid\s*$[\s\S]*^```\s*$/m.test(x.src)},
       {l:"Dev ->> GH: git push", t:x => /^\s*Dev\s*->>\s*GH\s*:\s*git push\s*$/m.test(x.src)},
       {l:"GH ->> Hook: POST /webhook", t:x => /^\s*GH\s*->>\s*Hook\s*:\s*POST \/webhook\s*$/m.test(x.src)},
       {l:"Hook -->> GH: 200 OK (dotted reply)", t:x => /^\s*Hook\s*-->>\s*GH\s*:\s*200 OK\s*$/m.test(x.src)},
       {l:"Note over Hook: verify signature", t:x => /^\s*Note\s+(over|right of|left of)\s+Hook\s*:\s*verify signature\s*$/mi.test(x.src)}
     ],
     hint:`<code>A->>B: text</code> is a request and <code>B-->>A: text</code> is a reply. Notes: <code>Note over Hook: text</code>.`,
     solution:`${FENCE}mermaid
sequenceDiagram
    participant Dev
    participant GH as GitHub
    participant Hook as Webhook receiver
    Dev->>GH: git push
    GH->>Hook: POST /webhook
    Note over Hook: verify signature
    Hook-->>GH: 200 OK
${FENCE}`,
     explain:`<code>-></code> draws a line without an arrowhead. Use <code>->></code> for calls and <code>-->></code> for responses. A message without a colon and text is a syntax error, so the whole diagram fails to render. On GitHub, only a fenced <code>mermaid</code> block is rendered as a diagram.`},
    {id:"mm-gantt", kind:"code", lang:"mermaid", title:"Release plan as a Gantt chart",
     task:`Write a Mermaid Gantt chart:
       <ul class="tips"><li>title <code>Sprint 42</code>, date format <code>YYYY-MM-DD</code></li>
       <li>section <code>Build</code>: task <code>Develop</code> with id <code>dev</code>, starting 2026-03-02, 10 days</li>
       <li>section <code>Test</code>: task <code>Test</code> with id <code>test</code>, starting after <code>dev</code>, 5 days</li>
       <li>section <code>Release</code>: a <b>milestone</b> <code>Go live</code> right after <code>test</code></li></ul>`,
     starter:``,
     checks:[
       {l:"Starts with gantt", t:x => /^\s*gantt\s*$/m.test(x.src)},
       {l:"title Sprint 42", t:x => /^\s*title\s+Sprint 42\s*$/m.test(x.src)},
       {l:"dateFormat YYYY-MM-DD", t:x => /^\s*dateFormat\s+YYYY-MM-DD\s*$/m.test(x.src)},
       {l:"Three sections: Build, Test, Release", t:x => /^\s*section\s+Build\s*$[\s\S]*^\s*section\s+Test\s*$[\s\S]*^\s*section\s+Release\s*$/m.test(x.src)},
       {l:"Develop :dev, 2026-03-02, 10d", t:x => /^\s*Develop\s*:[^\n]*\bdev\s*,\s*2026-03-02\s*,\s*10d\s*$/m.test(x.src)},
       {l:"Test :test, after dev, 5d", t:x => /^\s*Test\s*:[^\n]*\btest\s*,\s*after\s+dev\s*,\s*5d\s*$/m.test(x.src)},
       {l:"Go live is a milestone after test", t:x => /^\s*Go live\s*:[^\n]*\bmilestone\b[^\n]*after\s+test\b/m.test(x.src)}
     ],
     hint:`<code>Develop :dev, 2026-03-02, 10d</code> and <code>Test :test, after dev, 5d</code>. A milestone: <code>Go live :milestone, live, after test, 0d</code>.`,
     solution:`gantt
    title Sprint 42
    dateFormat YYYY-MM-DD
    section Build
    Develop :dev, 2026-03-02, 10d
    section Test
    Test :test, after dev, 5d
    section Release
    Go live :milestone, live, after test, 0d`,
     explain:`IDs let tasks chain with <code>after &lt;id&gt;</code>, so moving one date shifts the whole plan. Tags such as <code>milestone</code>, <code>crit</code>, <code>done</code> and <code>active</code> come before the ID. Wrap the chart in <code>::: mermaid</code> for an Azure DevOps wiki or in a fenced <code>mermaid</code> block for GitHub.`},
    {id:"mm-dotted", kind:"mcq", title:"Arrow syntax",
     task:`In a Mermaid flowchart, which link draws a <b>dotted line with an arrowhead</b> from A to B?`,
     options:[`<code>A --> B</code>`, `<code>A ==> B</code>`, `<code>A --- B</code>`, `<code>A -.-> B</code>`],
     answer:3,
     hint:`The dot is in the middle of the arrow.`,
     explain:`<code>--></code> is a solid arrow, <code>==></code> a thick arrow, <code>---</code> a line without an arrowhead, and <code>-.-></code> a dotted arrow. Dotted arrows often mark optional or asynchronous steps.`},
    {id:"mm-ado", kind:"mcq", title:"Diagram doesn't render in the wiki",
     task:`A diagram renders fine on GitHub, but on an Azure DevOps wiki page this shows only an error:<br><code>::: mermaid</code> / <code>flowchart LR</code> / <code>A[Build] --> B[Deploy]</code> / <code>:::</code><br>What's the simplest fix?`,
     options:[
       `Replace <code>::: mermaid</code> with <code>[[_MERMAID_]]</code>`,
       `Change <code>flowchart LR</code> to <code>graph LR</code>`,
       `Install a Mermaid extension from the Visual Studio Marketplace`,
       `Export the diagram as SVG and attach it to the page`],
     answer:1,
     hint:`The Azure DevOps docs list a keyword that isn't supported.`,
     explain:`The Azure DevOps wiki supports a limited Mermaid syntax, and its docs name <code>flowchart</code> as unsupported: use <code>graph</code>. Mermaid is built in, so there's nothing to install. Exporting an image would lose the advantage of a diagram you can diff and review.`}
  ]

{
  group:"Release documentation",
  title:"Release notes",
  tag:"GitHub releases · release.yml · pipelines",
  intro:`Release notes tell users what changed. On GitHub you get them almost for free from merged pull requests. In Azure Pipelines you build them from the work items, commits and pull requests linked to a run.`,
  sections:[
    {h:"GitHub releases and generated notes", p:`A GitHub release is attached to a <b>tag</b>. It has a title, notes, optional binary assets, and can be a <b>draft</b> or a <b>pre-release</b>. The <b>Generate release notes</b> button (or the API and CLI equivalents) fills the notes with a <i>What's Changed</i> list of merged pull requests since the previous release, a <i>New Contributors</i> section and a <i>Full Changelog</i> compare link. You customise it with <code>.github/release.yml</code>:`,
     file:".github/release.yml", lang:"yaml", code:`changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - octocat
  categories:
    - title: Breaking changes 🛠
      labels:
        - breaking-change
    - title: New features 🎉
      labels:
        - enhancement
    - title: Other changes
      labels:
        - "*"            # catch-all: quote it, a bare * is YAML alias syntax`,
     after:`<p>A pull request lands in the <b>first</b> category whose labels match, so the <code>"*"</code> catch-all goes last. You can also put an <code>exclude</code> block inside a single category.</p>`},
    {h:"Automating it", lang:"sh", code:`# CLI: create a release for an existing tag and let GitHub write the notes
gh release create v2.4.0 --title "Shop 2.4.0" --generate-notes --draft
gh release create v2.4.0 --notes-file CHANGELOG-2.4.0.md    # or bring your own notes

# REST
POST /repos/{owner}/{repo}/releases                  {"tag_name":"v2.4.0","generate_release_notes":true}
POST /repos/{owner}/{repo}/releases/generate-notes   # preview the generated text only`},
    {h:"In a GitHub Actions workflow", file:".github/workflows/release.yml", lang:"yaml", code:`name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write          # creating a release needs write access to contents
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with generated notes
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: \${{ github.token }}`},
    {h:"Release notes in Azure Pipelines", p:`Every pipeline run knows its associated <b>commits</b> and <b>work items</b>. A script step can read them through the REST API using the job's <code>System.AccessToken</code>, render Markdown, and publish it as a pipeline artifact or as a wiki page. Marketplace tasks, such as the community <i>Generate Release Notes</i> extension, do the same from a Handlebars template. In a YAML pipeline's <b>Settings</b>, <b>Automatically link new work items in this build</b> adds an <i>Integrated in build</i> link to each associated work item. That gives you traceability from the work item to the build, for Azure Repos and GitHub repos alike.`,
     lang:"yaml", code:`- script: |
    curl -s -H "Authorization: Bearer $(System.AccessToken)" \\
      "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/workitems?api-version=7.1" \\
      -o workitems.json
  displayName: Get work items linked to this run
# also useful: .../_apis/build/builds/{id}/changes  (commits)
#              .../_apis/build/workitems?fromBuildId=..&toBuildId=..  (between two runs)`}
  ],
  tip:`"Generate release notes automatically from pull requests" on GitHub → <b>generated release notes</b>, customised with <code>.github/release.yml</code> (labels → categories). "Release notes from work items" in Azure DevOps → query the run's work items (REST or a Marketplace task) in the pipeline and publish the result, often to the wiki.`,
  exercises:[
    {id:"rn-config", kind:"code", lang:"yaml", title:"Configure generated release notes",
     task:`Write <code>.github/release.yml</code> so that generated release notes:
       <ul class="tips"><li>leave out pull requests labelled <code>ignore-for-release</code></li>
       <li>group PRs labelled <code>enhancement</code> under a title containing <b>Features</b></li>
       <li>group PRs labelled <code>bug</code> under a title containing <b>Bug</b> or <b>Fixes</b></li>
       <li>put everything else under <code>Other changes</code> with a <code>"*"</code> catch-all, as the <b>last</b> category</li></ul>`,
     starter:`# .github/release.yml
`,
     checks:[
       {l:"changelog.exclude.labels contains ignore-for-release", t:x => x.y.h("changelog.exclude.labels[]","ignore-for-release")},
       {l:"A Features category with label enhancement", t:x => x.y.item("changelog.categories",{title:/feature/i, "labels[]":"enhancement"})},
       {l:"A Bug/Fixes category with label bug", t:x => x.y.item("changelog.categories",{title:/bug|fix/i, "labels[]":"bug"})},
       {l:"Other changes category with the \"*\" label (quoted)", t:x => x.y.item("changelog.categories",{title:/other/i, "labels[]":"*"}) && /["']\*["']/.test(x.src)},
       {l:"The catch-all category comes last", t:x => { const s = x.y.first("changelog.categories[].labels[]","*"); return s < Infinity && s > x.y.first("changelog.categories[].labels[]","enhancement") && s > x.y.first("changelog.categories[].labels[]","bug"); }}
     ],
     hint:`Top key <code>changelog:</code> → <code>exclude: labels:</code> and <code>categories:</code>, a list of <code>- title: …</code> + <code>labels: [ … ]</code>.`,
     solution:`changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: New Features 🎉
      labels:
        - enhancement
    - title: Bug Fixes 🐛
      labels:
        - bug
    - title: Other changes
      labels:
        - "*"`,
     alts:[`changelog:\n  exclude:\n    labels: [ignore-for-release]\n  categories:\n    - title: Features\n      labels: [enhancement]\n    - title: Fixes\n      labels: [bug]\n    - title: Other changes\n      labels: ["*"]`],
     explain:`GitHub reads <code>.github/release.yml</code> (or <code>.yaml</code>) from the default branch when it generates notes. Each pull request goes into the first category whose labels match, so a catch-all placed first would swallow everything. <code>*</code> must be quoted because a bare <code>*</code> starts a YAML alias.`},
    {id:"rn-gh", kind:"code", lang:"sh", title:"Create a draft release with the GitHub CLI",
     task:`The tag <code>v2.4.0</code> already exists. Write one <code>gh</code> command that creates a <b>draft</b> release for it titled <code>Shop 2.4.0</code>, with automatically generated notes.`,
     starter:`# gh ...
`,
     checks:[
       {l:"gh release create v2.4.0", t:x => /gh\s+release\s+create\s+["']?v2\.4\.0["']?(\s|$)/.test(x.src)},
       {l:"--generate-notes", t:x => /--generate-notes\b/.test(x.src)},
       {l:"Draft (--draft or -d)", t:x => /(\s--draft|\s-d)(\s|$)/.test(x.src)},
       {l:"Title \"Shop 2.4.0\" (--title or -t)", t:x => /(--title|-t)\s+(["'])Shop 2\.4\.0\2/.test(x.src)}
     ],
     hint:`<code>gh release create &lt;tag&gt; --title "…" --generate-notes --draft</code>`,
     solution:`gh release create v2.4.0 --title "Shop 2.4.0" --generate-notes --draft`,
     alts:[`gh release create v2.4.0 -d -t 'Shop 2.4.0' --generate-notes`],
     explain:`<code>--generate-notes</code> calls the same generator as the button in the UI and respects <code>.github/release.yml</code>. A draft isn't public until someone publishes it, which leaves time to polish the generated text. Add <code>--notes-start-tag</code> to compare against a specific earlier tag.`},
    {id:"rn-workflow", kind:"code", lang:"yaml", title:"Release on every version tag",
     task:`Write a GitHub Actions workflow that runs when a tag matching <code>v*</code> is pushed. It should create a release for that tag with generated notes using <code>gh release create</code>. Give the workflow the permission it needs and pass the token to <code>gh</code> as <code>GH_TOKEN</code>.`,
     starter:`# .github/workflows/release.yml
`,
     checks:[
       {l:"on.push.tags includes v*", t:x => x.y.h("on.push.tags[]", /^v\*?/)},
       {l:"permissions.contents: write", t:x => x.y.h(/^(jobs\.[^.]+\.)?permissions\.contents$/i, "write")},
       {l:"A job with runs-on", t:x => x.y.h("jobs.*.runs-on")},
       {l:"A step runs gh release create … --generate-notes", t:x => x.y.h("jobs.*.steps[].run", /gh\s+release\s+create[\s\S]*--generate-notes/)},
       {l:"GH_TOKEN set from github.token or secrets.GITHUB_TOKEN", t:x => x.y.h(/(^|\.)env\.GH_TOKEN$/i, /\$\{\{\s*(github\.token|secrets\.GITHUB_TOKEN)\s*\}\}/)}
     ],
     hint:`<code>on: push: tags: ['v*']</code>, <code>permissions: contents: write</code>, and on the step <code>env: GH_TOKEN: \${{ github.token }}</code>. The tag name is in <code>$GITHUB_REF_NAME</code>.`,
     solution:`name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}`,
     explain:`Pushing a tag such as <code>v2.4.0</code> starts the workflow, and <code>GITHUB_REF_NAME</code> holds the tag name. The default <code>GITHUB_TOKEN</code> is often read-only, so the workflow requests <code>contents: write</code>. The <code>gh</code> CLI reads its token from <code>GH_TOKEN</code>.`},
    {id:"rn-content", kind:"multi", title:"What goes into generated notes?",
     task:`Which of these does GitHub's <b>automatically generated release notes</b> feature include by default? Select all that apply.`,
     options:[
       `A list of the merged pull requests since the previous release`,
       `Every commit message since the previous release`,
       `A <i>New Contributors</i> section for first-time contributors`,
       `A link to the full changelog (a compare view between the two tags)`,
       `The Azure Boards work items mentioned with <code>AB#</code>`],
     answer:[0,2,3],
     hint:`It's built from pull requests, not from individual commits.`,
     explain:`Generated notes list <b>merged pull requests</b> (title, author, link), grouped by the categories in <code>.github/release.yml</code>. They also include a <b>New Contributors</b> section and a <b>Full Changelog</b> compare link. Individual commits and Azure Boards work items aren't part of them. For those, use a changelog generator or a pipeline step.`},
    {id:"rn-ado", kind:"mcq", title:"Traceability from work item to build",
     task:`A YAML pipeline in Azure Pipelines builds a GitHub repo that is connected to Azure Boards. Product owners want each user story's <b>Development</b> section to show the build that included it, so release notes can be compiled from work items. What do you do?`,
     options:[
       `Add <code>AB#</code> IDs to the pipeline YAML file`,
       `Enable <b>Automatically link new work items in this build</b> in the pipeline settings`,
       `Create a <i>Build completed</i> service hook that posts to a Web Hooks endpoint`,
       `Require <code>Fixes AB#</code> in every commit with a branch policy`],
     answer:1,
     hint:`It's a pipeline setting that creates <i>Integrated in build</i> links.`,
     explain:`With <b>Automatically link new work items in this build</b> turned on, every work item associated with the run's changes gets an <i>Integrated in build</i> link. A release-notes step can then query <code>_apis/build/builds/{id}/workitems</code>. A service hook only sends a notification and creates no links. GitHub repos have no Azure Repos branch policies.`}
  ]

{
  group:"Release documentation",
  title:"API documentation",
  tag:"XML docs · DocFX · OpenAPI · publish",
  intro:`API docs come from two kinds of source. <b>Comments in the code</b> produce reference docs for libraries. <b>OpenAPI definitions</b> describe HTTP APIs. Either way, generate the docs in the pipeline so they always match the code you ship.`,
  sections:[
    {h:"Reference docs from code comments", lang:"text", code:`.NET        /// <summary> XML comments  +  <GenerateDocumentationFile>  →  DocFX site
JS / TS     /** JSDoc */ comments                                  →  JSDoc / TypeDoc
Python      docstrings                                            →  Sphinx (autodoc)
C / C++     comment blocks                                        →  Doxygen
Java        /** Javadoc */                                        →  javadoc`,
     after:`<div class="file">Calculator.cs</div><div class="codewrap"><pre><code>/// &lt;summary&gt;Calculates the order total including VAT.&lt;/summary&gt;
/// &lt;param name="order"&gt;The order to price.&lt;/param&gt;
/// &lt;returns&gt;The total in EUR.&lt;/returns&gt;
public decimal GetTotal(Order order) { ... }</code></pre></div>`},
    {h:"DocFX", lang:"sh", code:`dotnet tool update -g docfx     # install or update the DocFX global tool
docfx init                      # scaffold docfx.json, toc.yml, index.md
docfx metadata docfx.json       # extract API metadata (YAML) from the projects
docfx build docfx.json          # build the static site into _site/
docfx docfx.json --serve        # metadata + build + local preview`,
     p:`DocFX combines the API reference generated from your assemblies with hand-written Markdown articles. The output is a static site in <code>_site/</code>, which you can host anywhere.`},
    {h:"OpenAPI for HTTP APIs", p:`<b>Code-first</b>: the framework generates the OpenAPI document from your code. Since .NET 9, ASP.NET Core does this with <code>Microsoft.AspNetCore.OpenApi</code> (<code>builder.Services.AddOpenApi()</code> + <code>app.MapOpenApi()</code> → <code>/openapi/v1.json</code>). Swashbuckle is the older community option. <b>Design-first</b>: you write <code>openapi.yaml</code> by hand, review it, and generate stubs and clients from it. Swagger UI or Redoc render the document as browsable docs. <b>Azure API Management</b> can import it and publish it in its <b>developer portal</b>, with try-it consoles and subscription keys.`,
     file:"openapi.yaml", lang:"yaml", code:`openapi: 3.0.3
info:
  title: Orders API
  version: 1.2.0
paths:
  /orders:
    get:
      summary: List orders
      responses:
        '200':
          description: A page of orders`},
    {h:"Publishing from a pipeline", lang:"yaml", code:`steps:
  - script: dotnet tool update -g docfx
    displayName: Install DocFX
  - script: docfx docs/docfx.json
    displayName: Build API docs
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: docs/_site
      artifact: api-docs
# then deploy the site: Azure Static Web Apps (AzureStaticWebApp@0),
# a storage static website (az storage blob upload-batch -d '$web' -s docs/_site ...),
# App Service, or GitHub Pages (actions/upload-pages-artifact + actions/deploy-pages).
# For an HTTP API: az apim api import --specification-format OpenApi --specification-path openapi.yaml ...`}
  ],
  tip:`"Docs must always match the deployed version" → generate them <b>in the build pipeline</b> (code-first OpenAPI, XML comments + DocFX) and deploy them with the release. "External developers need an interactive portal with keys" → import the OpenAPI definition into <b>Azure API Management</b> and use its developer portal.`,
  exercises:[
    {id:"api-xml", kind:"code", lang:"xml", title:"Turn on XML documentation",
     task:`Edit the project file so the build writes the XML documentation file that DocFX and IntelliSense use. Also stop the build from warning about every public member that has no XML comment (warning CS1591).`,
     starter:`<Project Sdk="Microsoft.NET.Sdk.Web">
  <PropertyGroup>
    <TargetFramework>net9.0</TargetFramework>
  </PropertyGroup>
</Project>
`,
     checks:[
       {l:"<GenerateDocumentationFile>true</GenerateDocumentationFile>", t:x => /<GenerateDocumentationFile>\s*true\s*<\/GenerateDocumentationFile>/i.test(x.src)},
       {l:"It sits inside a <PropertyGroup>", t:x => /<PropertyGroup[^>]*>(?:(?!<\/PropertyGroup>)[\s\S])*<GenerateDocumentationFile>/i.test(x.src)},
       {l:"<NoWarn> includes 1591", t:x => /<NoWarn>[^<]*\b(CS)?1591\b[^<]*<\/NoWarn>/i.test(x.src)}
     ],
     hint:`Both are MSBuild properties: <code>&lt;GenerateDocumentationFile&gt;</code> and <code>&lt;NoWarn&gt;$(NoWarn);1591&lt;/NoWarn&gt;</code>.`,
     solution:`<Project Sdk="Microsoft.NET.Sdk.Web">
  <PropertyGroup>
    <TargetFramework>net9.0</TargetFramework>
    <GenerateDocumentationFile>true</GenerateDocumentationFile>
    <NoWarn>$(NoWarn);1591</NoWarn>
  </PropertyGroup>
</Project>`,
     explain:`<code>GenerateDocumentationFile</code> makes the compiler write <code>&lt;Assembly&gt;.xml</code> next to the DLL. DocFX, IntelliSense and OpenAPI generators pick up the <code>/// &lt;summary&gt;</code> text from it. Keeping <code>$(NoWarn)</code> in the value preserves any warnings that were already suppressed.`},

     task:`Write a minimal OpenAPI 3 definition for the <code>Orders API</code>, version <code>1.0.0</code>, with one operation: <code>GET /orders/{id}</code>. It takes a <b>required path parameter</b> <code>id</code> and returns <code>200</code> with a description.`,
     starter:`openapi: 3.0.3
`,

       {l:"info.title Orders API and info.version 1.0.0", t:x => x.y.h("info.title","Orders API") && x.y.h("info.version","1.0.0")},

     solution:`openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders/{id}:

`,

       `Generate a PDF from the OpenAPI file and attach it to the GitHub release`,
       `Import the OpenAPI definition into Azure API Management from the pipeline and publish the developer portal`,

{
  group:"Release documentation",
  title:"Docs from Git history",
  tag:"git log · tags · Conventional Commits",
  intro:`Your Git history already describes every change. With disciplined commit messages and a few <code>git log</code> options you can generate changelogs and decide version numbers automatically.`,
  sections:[
    {h:"git log formats", lang:"sh", code:`git log --oneline                                   # a1b2c3d Fix login redirect
git log --pretty=format:"%h %as %an %s"             # a1b2c3d 2026-03-04 Ana Fix login redirect
git log v1.3.0..v1.4.0 --no-merges --pretty=format:"- %s (%h)"
git log --merges --first-parent main --pretty=format:"%s"   # one line per merged PR
git describe --tags --abbrev=0                      # most recent tag reachable from HEAD
git shortlog -sn v1.3.0..v1.4.0                     # contributors with commit counts`,
     after:`<table class="ref">
      <tr><th>Placeholder</th><th>Meaning</th><th>Placeholder</th><th>Meaning</th></tr>
      <tr><td><code>%H</code> / <code>%h</code></td><td>full / short hash</td><td><code>%an</code> / <code>%ae</code></td><td>author name / email</td></tr>
      <tr><td><code>%s</code></td><td>subject (first line)</td><td><code>%ad</code></td><td>author date (format with <code>--date=short|iso|relative</code>)</td></tr>
      <tr><td><code>%b</code></td><td>body</td><td><code>%as</code></td><td>author date as YYYY-MM-DD</td></tr>
      <tr><td><code>%d</code></td><td>ref names (tags, branches)</td><td><code>%n</code></td><td>newline</td></tr>
     </table>
     <p><code>A..B</code> means "commits reachable from B but not from A", so <code>v1.3.0..v1.4.0</code> is everything in 1.4.0 that wasn't in 1.3.0. Filter with <code>--no-merges</code>, <code>--author=</code>, <code>--grep=</code>, <code>--since=</code>.</p>`},
    {h:"Tags mark releases", lang:"sh", code:`git tag -a v1.4.0 -m "Release 1.4.0"   # annotated tag: tagger, date, message
git push origin v1.4.0                   # tags aren't pushed by default
git describe --tags --abbrev=0           # --tags also considers lightweight tags`},
    {h:"Conventional Commits", lang:"text", code:`feat(api): add pagination to GET /orders

Adds page and pageSize query parameters.

Refs: AB#1234
BREAKING CHANGE: GET /orders now returns at most 50 items per page.`,
     p:`Format: <code>&lt;type&gt;[(scope)][!]: &lt;description&gt;</code>, then an optional body and footers. <code>fix</code> → <b>PATCH</b>, <code>feat</code> → <b>MINOR</b>, a <code>!</code> after the type/scope or a <code>BREAKING CHANGE:</code> footer → <b>MAJOR</b>. Other types such as <code>build</code>, <code>chore</code>, <code>ci</code>, <code>docs</code>, <code>perf</code>, <code>refactor</code>, <code>style</code> and <code>test</code> don't bump the version by default. <b>commitlint</b> (in a <code>commit-msg</code> hook via husky, or as a CI check) enforces the format. <b>semantic-release</b>, <b>release-please</b>, <b>conventional-changelog</b> or <b>git-cliff</b> then generate <code>CHANGELOG.md</code>, the next version and the tag.`}
  ],
  tip:`"Automate documentation from Git history" → structured commit messages (Conventional Commits) plus a changelog generator in the pipeline. For simpler needs, <code>git log</code> between two tags with a <code>--pretty=format:</code> string.`,
  exercises:[
    {id:"git-log", kind:"code", lang:"sh", title:"Changelog lines between two tags",
     task:`Write one <code>git log</code> command that lists every commit in <code>v1.4.0</code> that wasn't in <code>v1.3.0</code>, <b>excluding merge commits</b>, formatted as Markdown bullets like <code>- Fix login redirect (a1b2c3d)</code>.`,
     starter:`# git log ...
`,
     checks:[
       {l:"git log with the range v1.3.0..v1.4.0", t:x => /git\s+log\b[^\n]*\bv1\.3\.0\.\.v1\.4\.0\b/.test(x.src)},
       {l:"--no-merges", t:x => /--no-merges\b/.test(x.src)},
       {l:"Format \"- %s (%h)\" via --pretty=format: / --format=", t:x => /(--pretty=(t?format:)|--format=)\s*(["']?)-\s+%s\s+\(%h\)\3/.test(x.src)}
     ],
     hint:`Range <code>old..new</code>. Placeholders: <code>%s</code> subject, <code>%h</code> short hash.`,
     solution:`git log v1.3.0..v1.4.0 --no-merges --pretty=format:"- %s (%h)"`,
     alts:[`git log --no-merges --format='- %s (%h)' v1.3.0..v1.4.0`, `git log v1.3.0..v1.4.0 --pretty=tformat:"- %s (%h)" --no-merges`],
     bad:[`git log v1.4.0..v1.3.0 --no-merges --pretty=format:"- %s (%h)"`],
     explain:`<code>v1.3.0..v1.4.0</code> means reachable from v1.4.0 but not from v1.3.0. Reversing the range returns nothing. <code>--no-merges</code> drops the "Merge pull request #…" noise. Redirect the output to a file (<code>&gt; CHANGELOG-1.4.0.md</code>) and you have release notes.`},
    {id:"git-since", kind:"code", lang:"sh", title:"Everything since the last tag",
     task:`Write a two-line script. Line 1 stores the most recent tag reachable from <code>HEAD</code> in the variable <code>LAST_TAG</code>. Line 2 prints a one-line-per-commit log of everything from that tag up to <code>HEAD</code>, excluding merges.`,
     starter:`# LAST_TAG=...
`,
     checks:[
       {l:"LAST_TAG=$(git describe --tags --abbrev=0)", t:x => /LAST_TAG=\$\(\s*git\s+describe\s+(--tags\s+--abbrev=0|--abbrev=0\s+--tags)\s*\)/.test(x.src)},
       {l:"git log $LAST_TAG..HEAD", t:x => /git\s+log\b[^\n]*["']?\$\{?LAST_TAG\}?["']?\.\.HEAD\b/.test(x.src)},
       {l:"--no-merges", t:x => /git\s+log\b[^\n]*--no-merges/.test(x.src)},
       {l:"One line per commit (--oneline or a --pretty/--format string)", t:x => /git\s+log\b[^\n]*(--oneline|--pretty=|--format=)/.test(x.src)}
     ],
     hint:`<code>git describe --tags --abbrev=0</code> prints just the tag name. Then use the range <code>"$LAST_TAG"..HEAD</code>.`,
     solution:`LAST_TAG=$(git describe --tags --abbrev=0)
git log "$LAST_TAG"..HEAD --no-merges --oneline`,
     alts:[`LAST_TAG=$(git describe --abbrev=0 --tags)\ngit log \${LAST_TAG}..HEAD --pretty=format:"- %s" --no-merges`],
     explain:`<code>--abbrev=0</code> stops <code>describe</code> from adding the <code>-3-gabc1234</code> suffix, so you get the bare tag. <code>--tags</code> includes lightweight tags too. In a pipeline, check out with full history (<code>fetchDepth: 0</code> in Azure Pipelines, <code>fetch-depth: 0</code> in <code>actions/checkout</code>). Otherwise there may be no tags to describe.`},
    {id:"git-cc", kind:"code", lang:"text", title:"Write Conventional Commit messages",
     task:`Write three commit subject lines (one per line):
       <ol class="tips"><li>a new feature in scope <code>api</code>: add pagination to the orders endpoint</li>
       <li>a bug fix in scope <code>ui</code>: fix the date picker time zone</li>
       <li>a <b>breaking change</b> that removes the v1 endpoint. Mark it in the subject, or add a <code>BREAKING CHANGE:</code> footer line after it.</li></ol>`,
     starter:``,
     checks:[
       {l:"feat(api): <description>", t:x => /^feat\(api\):\s+\S/m.test(x.src)},
       {l:"fix(ui): <description>", t:x => /^fix\(ui\):\s+\S/m.test(x.src)},
       {l:"A breaking change: type[(scope)]!: … or a BREAKING CHANGE: footer", t:x => /^[a-z]+(\([\w.\/-]+\))?!:\s+\S/m.test(x.src) || /^BREAKING[ -]CHANGE:\s+\S/m.test(x.src)},
       {l:"Each subject has a space after the colon", t:x => x.lines.filter(l => /^[a-z]+(\([^)]*\))?!?:/.test(l)).every(l => /^[a-z]+(\([^)]*\))?!?: \S/.test(l))}
     ],
     hint:`<code>type(scope): description</code>. Breaking: <code>feat(api)!: …</code> or a footer line <code>BREAKING CHANGE: …</code>.`,
     solution:`feat(api): add pagination to the orders endpoint
fix(ui): use the user's time zone in the date picker
feat(api)!: remove the v1 orders endpoint`,
     alts:[`feat(api): add pagination\nfix(ui): fix date picker time zone\nrefactor: remove v1 endpoint\nBREAKING CHANGE: /v1/orders is gone, use /v2/orders`],
     explain:`Tools map these to versions: the <code>feat</code> → minor, the <code>fix</code> → patch, and the <code>!</code> or <code>BREAKING CHANGE:</code> → major. A changelog generator groups the lines into <i>Features</i>, <i>Bug Fixes</i> and <i>Breaking Changes</i>.`},
    {id:"git-semver", kind:"mcq", title:"What's the next version?",
     task:`The last release is <code>2.3.1</code>. Since then these commits landed:<br><code>docs: fix typo in README</code><br><code>fix(cart): round totals correctly</code><br><code>feat(auth): support passkeys</code><br><code>chore(deps): bump lodash</code><br>With the default Conventional Commits rules (for example semantic-release), what's the next version?`,
     options:[`2.3.2`, `2.4.0`, `3.0.0`, `2.4.1`],
     answer:1,
     hint:`The highest-ranking change wins: breaking > feat > fix.`,
     explain:`There's a <code>feat</code> and no breaking change, so the minor version goes up and the patch resets: <b>2.4.0</b>. The <code>fix</code> alone would have produced 2.3.2. <code>docs</code> and <code>chore</code> don't trigger a release by default. A <code>feat!:</code> or <code>BREAKING CHANGE:</code> footer would have produced 3.0.0.`},
    {id:"git-lint", kind:"mcq", title:"Enforce the convention",
     task:`Your changelog generator depends on Conventional Commits, but people keep writing messages like "stuff" and "wip". Which tool rejects non-conforming commit messages, locally in a <code>commit-msg</code> hook and as a pull request check?`,
     options:[`git-cliff`, `DocFX`, `commitlint`, `release-please`],
     answer:2,
     hint:`Its name says what it does to commit messages.`,
     explain:`<b>commitlint</b> validates messages against a ruleset (for example <code>@commitlint/config-conventional</code>). Run it from a husky <code>commit-msg</code> hook and as a CI step on pull requests. git-cliff and release-please <i>consume</i> the history to produce changelogs and releases. DocFX builds documentation sites. If you squash-merge, also validate the PR title, because it becomes the commit subject.`}
  ]
},
